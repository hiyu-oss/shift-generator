 <!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シフト自動作成</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f6f8;
  color: #222;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
               Arial, sans-serif;
}

.container {
  max-width: 1500px;
  margin: auto;
  padding: 15px;
}

h1 {
  font-size: 24px;
  margin: 5px 0 20px;
}

h2 {
  font-size: 18px;
  margin: 20px 0 12px;
}

.card {
  background: #fff;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: flex-start;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

label {
  font-size: 13px;
  font-weight: bold;
}

input,
select,
button {
  font-size: 16px;
  border-radius: 8px;
}

input,
select {
  padding: 8px;
  border: 1px solid #ccc;
  background: white;
}

input[type="text"] {
  width: 130px;
}

input[type="number"] {
  width: 90px;
}

button {
  border: 0;
  padding: 11px 15px;
  color: white;
  background: #333;
  font-weight: bold;
}

button.primary {
  width: 100%;
  background: #1677ff;
  font-size: 18px;
  padding: 14px;
}

button.danger {
  background: #e53935;
}

.small {
  font-size: 12px;
  color: #666;
  line-height: 1.6;
}

.info {
  background: #eef6ff;
  border: 1px solid #b8d9ff;
  padding: 10px;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.6;
}

.success {
  background: #e8f5e9;
  border: 1px solid #81c784;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 12px;
}

.error {
  background: #ffebee;
  border: 1px solid #ef9a9a;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 12px;
  line-height: 1.6;
}

.staff-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 10px;
}

.staff-card {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 12px;
}

.staff-title {
  font-weight: bold;
  margin-bottom: 10px;
}

.scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

table {
  border-collapse: collapse;
  white-space: nowrap;
}

th,
td {
  border: 1px solid #ccc;
  text-align: center;
}

.request-table th,
.request-table td {
  padding: 3px;
}

.request-table th:first-child,
.request-table td:first-child,
.result-table th:first-child,
.result-table td:first-child {
  position: sticky;
  left: 0;
  z-index: 5;
  background: white;
  min-width: 90px;
}

.date-head {
  min-width: 65px;
}

.request-select {
  width: 68px;
  padding: 5px 2px;
  font-size: 12px;
}

.request-none {
  background: white;
}

.request-ha {
  background: #dbeafe;
}

.request-hp {
  background: #eadcff;
}

.request-rest {
  background: #ffd9d9;
}

.request-paid {
  background: #ffe7b3;
}

.result-table th,
.result-table td {
  min-width: 62px;
  height: 48px;
  padding: 4px;
}

.shift-ha {
  background: #dbeafe;
  font-weight: bold;
}

.shift-hp {
  background: #eadcff;
  font-weight: bold;
}

.shift-rest {
  background: #eee;
}

.shift-paid {
  background: #ffe7b3;
  font-weight: bold;
}

.request-mark {
  display: block;
  font-size: 9px;
  opacity: .75;
  margin-top: 2px;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 10px;
  font-size: 12px;
}

.legend span {
  padding: 5px 8px;
  border-radius: 6px;
}

.hidden {
  display: none;
}

.month-days {
  font-size: 13px;
  color: #1677ff;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>シフト自動作成</h1>


<!-- =========================
     基本設定
========================= -->

<div class="card">

<h2>基本設定</h2>

<div class="row">

  <div class="field">
    <label>年</label>
    <select id="year"></select>
  </div>

  <div class="field">
    <label>月</label>
    <select id="month"></select>
  </div>

  <div class="field">
    <label>人数</label>
    <select id="staffCount">
      <option value="1">1人</option>
      <option value="2">2人</option>
      <option value="3">3人</option>
      <option value="4">4人</option>
      <option value="5">5人</option>
      <option value="6">6人</option>
      <option value="7">7人</option>
      <option value="8">8人</option>
      <option value="9">9人</option>
      <option value="10" selected>10人</option>
    </select>
  </div>

  <div class="field">
    <label>最大連勤</label>
    <select id="maxConsecutive">
      <option value="2">2連勤</option>
      <option value="3" selected>3連勤</option>
      <option value="4">4連勤</option>
      <option value="5">5連勤</option>
      <option value="6">6連勤</option>
    </select>
  </div>

</div>

<br>

<div class="month-days">
  この月の日数：<span id="daysLabel"></span>日
</div>

<p class="small">
月を変更すると、28日・29日・30日・31日に自動で切り替わります。
</p>

</div>


<!-- =========================
     前月末について
========================= -->

<div class="card">

<h2>前月末の状態</h2>

<div class="info">
前月末の勤務状況を入力してください。<br>
これを使って、<strong>月をまたいだ連勤数</strong>と
<strong>HP→翌日HA禁止</strong>を判定します。
</div>

<br>

<div id="previousContainer" class="staff-grid"></div>

</div>


<!-- =========================
     必要人数
========================= -->

<div class="card">

<h2>1日の必要人数</h2>

<div class="row">

  <div class="field">
    <label>HA</label>
    <input type="number" id="haNeed" value="3" min="0" max="10">
  </div>

  <div class="field">
    <label>HP</label>
    <input type="number" id="hpNeed" value="2" min="0" max="10">
  </div>

</div>

</div>


<!-- =========================
     スタッフ
========================= -->

<div class="card">

<h2>スタッフ設定</h2>

<div id="staffContainer" class="staff-grid"></div>

</div>


<!-- =========================
     希望入力
========================= -->

<div class="card">

<h2>希望入力</h2>

<div class="small">
未指定 / HA希望 / HP希望 / 休 / 有休
</div>

<br>

<div class="scroll">
<table class="request-table">

<thead id="requestHead"></thead>
<tbody id="requestBody"></tbody>

</table>
</div>

<div class="legend">
<span class="request-ha">HA希望</span>
<span class="request-hp">HP希望</span>
<span class="request-rest">休希望</span>
<span class="request-paid">有休</span>
</div>

</div>


<!-- =========================
     作成
========================= -->

<div class="card">

<button class="primary" id="generateBtn">
シフトを作成する
</button>

<br><br>

<button class="danger" id="resetBtn">
希望入力をリセット
</button>

</div>


<div id="message"></div>


<!-- =========================
     結果
========================= -->

<div class="card hidden" id="resultCard">

<h2>作成結果</h2>

<div class="scroll">

<table class="result-table">

<thead id="resultHead"></thead>
<tbody id="resultBody"></tbody>

</table>

</div>

<div class="legend">
<span class="shift-ha">HA</span>
<span class="shift-hp">HP</span>
<span class="shift-rest">休</span>
<span class="shift-paid">有休</span>
</div>

</div>

</div>


<script>

/* =========================================================
   データ
========================================================= */

let days = 0;

let staff = [];
let requests = [];
let previousState = [];

let schedule = [];


/* =========================================================
   DOM
========================================================= */

const yearSelect =
  document.getElementById("year");

const monthSelect =
  document.getElementById("month");

const staffCountSelect =
  document.getElementById("staffCount");

const maxConsecutiveSelect =
  document.getElementById("maxConsecutive");


/* =========================================================
   年・月
========================================================= */

const today = new Date();

for (
  let y = today.getFullYear() - 1;
  y <= today.getFullYear() + 3;
  y++
) {

  const option =
    document.createElement("option");

  option.value = y;
  option.textContent = y + "年";

  if (y === today.getFullYear()) {
    option.selected = true;
  }

  yearSelect.appendChild(option);
}


for (let m = 1; m <= 12; m++) {

  const option =
    document.createElement("option");

  option.value = m;
  option.textContent = m + "月";

  if (m === today.getMonth() + 1) {
    option.selected = true;
  }

  monthSelect.appendChild(option);

}


/* =========================================================
   月の日数
   ★ここが重要
========================================================= */

function getDaysInSelectedMonth() {

  const year =
    Number(yearSelect.value);

  const month =
    Number(monthSelect.value);

  /*
    JSでは month=0 が1月。
    「選択月の0日」を指定すると
    前月の最終日になる。
    
    例：
    new Date(2026, 2, 0)
    → 2026年2月28日
    → 2月の日数は28
  */

  return new Date(
    year,
    month,
    0
  ).getDate();

}


/* =========================================================
   月変更
========================================================= */

function changeMonth() {

  const oldRequests =
    requests;

  days =
    getDaysInSelectedMonth();

  document.getElementById("daysLabel")
    .textContent = days;


  /*
    希望入力は、存在する日だけ引き継ぐ。
    
    31日→30日なら31日の入力は消える。
    30日→31日なら31日は空欄で追加。
  */

  requests = [];

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    requests[s] = [];

    for (
      let d = 0;
      d < days;
      d++
    ) {

      requests[s][d] =
        oldRequests[s]?.[d] || "";

    }

  }


  /*
    公休・有休が月の日数を超えないようにする
  */

  staff.forEach(person => {

    person.publicHoliday =
      Math.min(
        Number(person.publicHoliday) || 0,
        days
      );

    person.paidLeave =
      Math.min(
        Number(person.paidLeave) || 0,
        days
      );

  });


  renderAll();

}


/* =========================================================
   スタッフ初期値
========================================================= */

function createStaff() {

  const count =
    Number(staffCountSelect.value);

  const oldStaff =
    staff;

  const oldPrevious =
    previousState;

  staff = [];
  previousState = [];


  for (
    let i = 0;
    i < count;
    i++
  ) {

    staff.push({

      name:
        oldStaff[i]?.name ||
        String.fromCharCode(65 + i),

      level:
        oldStaff[i]?.level || 2,

      publicHoliday:
        oldStaff[i]?.publicHoliday ?? 11,

      paidLeave:
        oldStaff[i]?.paidLeave ?? 0

    });


    previousState.push({

      shift:
        oldPrevious[i]?.shift || "休",

      consecutive:
        oldPrevious[i]?.consecutive ?? 0

    });

  }

}


/* =========================================================
   希望入力初期化
========================================================= */

function createRequests() {

  const old =
    requests;

  requests = [];


  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    requests[s] = [];

    for (
      let d = 0;
      d < days;
      d++
    ) {

      requests[s][d] =
        old[s]?.[d] || "";

    }

  }

}


/* =========================================================
   全UI
========================================================= */

function renderAll() {

  renderPrevious();

  renderStaff();

  renderRequests();

}


/* =========================================================
   前月末
========================================================= */

function renderPrevious() {

  const container =
    document.getElementById(
      "previousContainer"
    );

  container.innerHTML = "";


  staff.forEach((person, i) => {

    const div =
      document.createElement("div");

    div.className =
      "staff-card";


    div.innerHTML = `

      <div class="staff-title">
        ${escapeHtml(person.name)}
      </div>

      <div class="row">

        <div class="field">

          <label>
            前月最終日
          </label>

          <select
            data-prev-staff="${i}"
            data-prev-field="shift"
          >

            <option value="HA"
              ${previousState[i].shift === "HA" ? "selected" : ""}>
              HA
            </option>

            <option value="HP"
              ${previousState[i].shift === "HP" ? "selected" : ""}>
              HP
            </option>

            <option value="休"
              ${previousState[i].shift === "休" ? "selected" : ""}>
              休
            </option>

            <option value="有休"
              ${previousState[i].shift === "有休" ? "selected" : ""}>
              有休
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            前月末の連勤
          </label>

          <select
            data-prev-staff="${i}"
            data-prev-field="consecutive"
          >

            ${createConsecutiveOptions(
              previousState[i].consecutive
            )}

          </select>

        </div>

      </div>

    `;

    container.appendChild(div);

  });

}


function createConsecutiveOptions(selected) {

  const max =
    Number(maxConsecutiveSelect.value);

  let html = "";

  for (
    let i = 0;
    i <= max;
    i++
  ) {

    html += `
      <option
        value="${i}"
        ${Number(selected) === i ? "selected" : ""}
      >
        ${i === 0 ? "0（休み）" : i + "連勤目"}
      </option>
    `;

  }

  return html;

}


/* =========================================================
   スタッフ表示
========================================================= */

function renderStaff() {

  const container =
    document.getElementById(
      "staffContainer"
    );

  container.innerHTML = "";


  staff.forEach((person, i) => {

    const div =
      document.createElement("div");

    div.className =
      "staff-card";


    div.innerHTML = `

      <div class="staff-title">
        スタッフ${i + 1}
      </div>

      <div class="row">

        <div class="field">

          <label>名前</label>

          <input
            type="text"
            value="${escapeHtml(person.name)}"
            data-staff="${i}"
            data-field="name"
          >

        </div>


        <div class="field">

          <label>レベル</label>

          <select
            data-staff="${i}"
            data-field="level"
          >

            <option value="1"
              ${person.level === 1 ? "selected" : ""}>
              1：研修中
            </option>

            <option value="2"
              ${person.level === 2 ? "selected" : ""}>
              2：独り立ち
            </option>

          </select>

        </div>


        <div class="field">

          <label>公休</label>

          <input
            type="number"
            min="0"
            max="${days}"
            value="${person.publicHoliday}"
            data-staff="${i}"
            data-field="publicHoliday"
          >

        </div>


        <div class="field">

          <label>有休</label>

          <input
            type="number"
            min="0"
            max="${days}"
            value="${person.paidLeave}"
            data-staff="${i}"
            data-field="paidLeave"
          >

        </div>

      </div>

    `;

    container.appendChild(div);

  });

}


/* =========================================================
   希望表
========================================================= */

function renderRequests() {

  const head =
    document.getElementById(
      "requestHead"
    );

  const body =
    document.getElementById(
      "requestBody"
    );


  head.innerHTML = "";
  body.innerHTML = "";


  let header =
    "<tr><th>名前</th>";


  for (
    let d = 0;
    d < days;
    d++
  ) {

    header += `
      <th class="date-head">
        ${d + 1}日
      </th>
    `;

  }


  header += "</tr>";

  head.innerHTML =
    header;


  staff.forEach((person, s) => {

    let row =
      `<tr>
        <td>
          ${escapeHtml(person.name)}
        </td>`;


    for (
      let d = 0;
      d < days;
      d++
    ) {

      const value =
        requests[s][d];

      const cls =
        requestClass(value);


      row += `

        <td class="${cls}">

          <select
            class="request-select"
            data-s="${s}"
            data-d="${d}"
          >

            <option value=""
              ${value === "" ? "selected" : ""}>
              -
            </option>

            <option value="HA"
              ${value === "HA" ? "selected" : ""}>
              HA希望
            </option>

            <option value="HP"
              ${value === "HP" ? "selected" : ""}>
              HP希望
            </option>

            <option value="休"
              ${value === "休" ? "selected" : ""}>
              休
            </option>

            <option value="有休"
              ${value === "有休" ? "selected" : ""}>
              有休
            </option>

          </select>

        </td>

      `;

    }


    row += "</tr>";

    body.innerHTML += row;

  });

}


function requestClass(value) {

  if (value === "HA")
    return "request-ha";

  if (value === "HP")
    return "request-hp";

  if (value === "休")
    return "request-rest";

  if (value === "有休")
    return "request-paid";

  return "request-none";

}


/* =========================================================
   入力イベント
========================================================= */

document.addEventListener(
  "change",
  event => {

    const target =
      event.target;


    /* スタッフ設定 */

    if (
      target.dataset.staff !== undefined
    ) {

      const i =
        Number(target.dataset.staff);

      const field =
        target.dataset.field;


      if (field === "name") {

        staff[i].name =
          target.value ||
          String.fromCharCode(
            65 + i
          );

        renderRequests();
        renderPrevious();

      }


      if (field === "level") {

        staff[i].level =
          Number(target.value);

      }


      if (
        field === "publicHoliday"
      ) {

        staff[i].publicHoliday =
          Math.max(
            0,
            Math.min(
              days,
              Number(target.value) || 0
            )
          );

        target.value =
          staff[i].publicHoliday;

      }


      if (
        field === "paidLeave"
      ) {

        staff[i].paidLeave =
          Math.max(
            0,
            Math.min(
              days,
              Number(target.value) || 0
            )
          );

        target.value =
          staff[i].paidLeave;

      }

    }


    /* 前月末 */

    if (
      target.dataset.prevStaff !== undefined
    ) {

      const i =
        Number(target.dataset.prevStaff);

      const field =
        target.dataset.prevField;


      if (field === "shift") {

        previousState[i].shift =
          target.value;

        /*
          休・有休なら連勤数は0にする
        */

        if (
          target.value === "休" ||
          target.value === "有休"
        ) {

          previousState[i].consecutive = 0;

        }

      }


      if (
        field === "consecutive"
      ) {

        previousState[i].consecutive =
          Number(target.value);

      }

    }


    /* 希望 */

    if (
      target.classList.contains(
        "request-select"
      )
    ) {

      const s =
        Number(target.dataset.s);

      const d =
        Number(target.dataset.d);


      requests[s][d] =
        target.value;


      target.closest("td").className =
        requestClass(
          target.value
        );

    }

  }
);


/* =========================================================
   最大連勤変更
========================================================= */

maxConsecutiveSelect.addEventListener(
  "change",
  () => {

    /*
      最大連勤を短くした場合、
      前月末連勤数も自動的に範囲内へ。
    */

    const max =
      Number(
        maxConsecutiveSelect.value
      );


    previousState.forEach(state => {

      if (
        state.consecutive > max
      ) {

        state.consecutive =
          max;

      }

    });


    renderPrevious();

  }
);


/* =========================================================
   月変更
========================================================= */

yearSelect.addEventListener(
  "change",
  changeMonth
);

monthSelect.addEventListener(
  "change",
  changeMonth
);


/* =========================================================
   人数変更
========================================================= */

staffCountSelect.addEventListener(
  "change",
  () => {

    createStaff();

    createRequests();

    renderAll();

  }
);


/* =========================================================
   ユーティリティ
========================================================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function shuffle(array) {

  const result =
    [...array];

  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];

  }

  return result;

}


/* =========================================================
   希望チェック
========================================================= */

function validateRequests() {

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    let paid = 0;
    let rest = 0;


    for (
      let d = 0;
      d < days;
      d++
    ) {

      if (
        requests[s][d] === "有休"
      ) paid++;

      if (
        requests[s][d] === "休"
      ) rest++;

    }


    if (
      paid >
      Number(staff[s].paidLeave)
    ) {

      return `${staff[s].name}さんの有休希望が、設定した有休数を超えています。`;

    }


    if (
      rest >
      Number(staff[s].publicHoliday)
    ) {

      return `${staff[s].name}さんの休希望が、設定した公休数を超えています。`;

    }

  }


  return "";

}


/* =========================================================
   その日の希望休固定判定
========================================================= */

function isFixedOff(s, d) {

  return (
    requests[s][d] === "休" ||
    requests[s][d] === "有休"
  );

}


/* =========================================================
   シフト候補を作る
========================================================= */

function makeDailyCandidates(
  day,
  previousShifts
) {

  const haNeed =
    Number(
      document.getElementById(
        "haNeed"
      ).value
    );

  const hpNeed =
    Number(
      document.getElementById(
        "hpNeed"
      ).value
    );


  const all =
    staff.map(
      (_, i) => i
    );


  /*
    休・有休希望者を除外
  */

  const available =
    all.filter(
      s => !isFixedOff(s, day)
    );


  if (
    available.length <
    haNeed + hpNeed
  ) {

    return [];

  }


  const candidates = [];


  /*
    HA候補3人を選ぶ
  */

  const haSets =
    combinations(
      available,
      haNeed
    );


  for (
    const ha of haSets
  ) {

    /*
      HP候補
    */

    const remaining =
      available.filter(
        s => !ha.includes(s)
      );


    const hpSets =
      combinations(
        remaining,
        hpNeed
      );


    for (
      const hp of hpSets
    ) {

      /*
        HP→翌日HA禁止
      */

      let invalid = false;


      for (
        const s of ha
      ) {

        if (
          previousShifts[s] === "HP"
        ) {

          invalid = true;
          break;

        }

      }


      if (invalid)
        continue;


      /*
        レベル1勤務時は
        レベル2が最低1人必要
      */

      const working =
        [...ha, ...hp];


      const hasLevel1 =
        working.some(
          s => staff[s].level === 1
        );

      const hasLevel2 =
        working.some(
          s => staff[s].level === 2
        );


      if (
        hasLevel1 &&
        !hasLevel2
      ) {

        continue;

      }


      /*
        希望点
      */

      let score = 0;


      for (
        const s of ha
      ) {

        if (
          requests[s][day] === "HA"
        ) {

          score += 100;

        }

        /*
          前日もHAなら継続を優先
        */

        if (
          previousShifts[s] === "HA"
        ) {

          score += 15;

        }

      }


      for (
        const s of hp
      ) {

        if (
          requests[s][day] === "HP"
        ) {

          score += 100;

        }


        if (
          previousShifts[s] === "HP"
        ) {

          score += 15;

        }

      }


      /*
        希望と違う勤務を少し減点
      */

      for (
        const s of working
      ) {

        const request =
          requests[s][day];


        if (
          request === "HA" &&
          !ha.includes(s)
        ) {

          score -= 40;

        }


        if (
          request === "HP" &&
          !hp.includes(s)
        ) {

          score -= 40;

        }

      }


      candidates.push({
        ha,
        hp,
        score
      });

    }

  }


  return candidates.sort(
    (a, b) =>
      b.score - a.score
  );

}


/* =========================================================
   組み合わせ生成
========================================================= */

function combinations(
  array,
  count
) {

  if (count === 0)
    return [[]];

  if (array.length < count)
    return [];


  const result = [];


  function dfs(
    start,
    chosen
  ) {

    if (
      chosen.length === count
    ) {

      result.push(
        [...chosen]
      );

      return;

    }


    for (
      let i = start;
      i < array.length;
      i++
    ) {

      chosen.push(
        array[i]
      );

      dfs(
        i + 1,
        chosen
      );

      chosen.pop();

    }

  }


  dfs(0, []);

  return result;

}


/* =========================================================
   連勤可能性
========================================================= */

function canWork(
  currentRun,
  maxConsecutive
) {

  return (
    currentRun <
    maxConsecutive
  );

}


/* =========================================================
   シフト作成
========================================================= */

function generateSchedule() {

  const haNeed =
    Number(
      document.getElementById(
        "haNeed"
      ).value
    );

  const hpNeed =
    Number(
      document.getElementById(
        "hpNeed"
      ).value
    );

  const required =
    haNeed + hpNeed;


  if (
    staff.length < required
  ) {

    return {
      error:
        `スタッフが${staff.length}人しかいません。` +
        `HA${haNeed}人＋HP${hpNeed}人なので、` +
        `最低${required}人必要です。`
    };

  }


  const maxConsecutive =
    Number(
      maxConsecutiveSelect.value
    );


  /*
    各人の必要休日日数
  */

  const offTarget =
    staff.map(
      p =>
        Number(p.publicHoliday) +
        Number(p.paidLeave)
    );


  /*
    まず固定休の数が公休・有休数を
   超えていないか確認
  */

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    let fixedOff = 0;

    let fixedPaid = 0;


    for (
      let d = 0;
      d < days;
      d++
    ) {

      if (
        requests[s][d] === "休"
      ) fixedOff++;

      if (
        requests[s][d] === "有休"
      ) {

        fixedOff++;
        fixedPaid++;

      }

    }


    if (
      fixedPaid >
      staff[s].paidLeave
    ) {

      return {
        error:
          `${staff[s].name}さんの有休希望が` +
          `設定数を超えています。`
      };

    }


    if (
      fixedOff >
      offTarget[s]
    ) {

      return {
        error:
          `${staff[s].name}さんの休み希望が多すぎます。`
      };

    }

  }


  /*
    総公休・有休数から考えて、
    毎日の必要人数と一致するか確認。
    
    10人・HA3・HP2・公休11なら
    10×30 - 11×10 = 190勤務日
    必要勤務日も5×30=150なので
    この例では「余分勤務」が発生する。
    
    そのため、必要人数を超える人は
    「応援勤務」として扱わず、
    公休として割り当てる。
    
    ただし公休数と完全一致しない場合は
    生成を試し、無理ならエラーにする。
  */


  let best = null;
  let bestScore = -Infinity;


  /*
    最大試行回数を制限。
    iPhoneで無限に処理しない。
  */

  const attempts = 250;


  for (
    let attempt = 0;
    attempt < attempts;
    attempt++
  ) {

    /*
      結果
    */

    const result =
      Array.from(
        {length: staff.length},
        () =>
          new Array(days)
            .fill(null)
      );


    /*
      休日日数カウント
    */

    const offCount =
      new Array(
        staff.length
      ).fill(0);


    /*
      連勤数
    */

    const run =
      previousState.map(
        state =>
          Number(state.consecutive) || 0
      );


    /*
      前日シフト
    */

    const previousShift =
      previousState.map(
        state =>
          state.shift || "休"
      );


    /*
      固定休を先に設定
    */

    for (
      let s = 0;
      s < staff.length;
      s++
    ) {

      for (
        let d = 0;
        d < days;
        d++
      ) {

        if (
          requests[s][d] === "有休"
        ) {

          result[s][d] =
            "有休";

          offCount[s]++;

        }

        else if (
          requests[s][d] === "休"
        ) {

          result[s][d] =
            "休";

          offCount[s]++;

        }

      }

    }


    let failed = false;


    /*
      1日ずつ決定
    */

    for (
      let d = 0;
      d < days;
      d++
    ) {

      /*
        前日までの状態を使って候補を作る
      */

      const candidates =
        makeDailyCandidates(
          d,
          previousShift
        );


      /*
        ランダム性を少し入れて、
        毎回同じ結果になりすぎないようにする
      */

      const shuffled =
        shuffle(candidates.slice(0, 40));


      if (
        shuffled.length === 0
      ) {

        failed = true;
        break;

      }


      let chosen = null;


      for (
        const candidate
        of shuffled
      ) {

        let valid = true;


        /*
          連勤チェック
        */

        const working =
          new Set([
            ...candidate.ha,
            ...candidate.hp
          ]);


        for (
          let s = 0;
          s < staff.length;
          s++
        ) {

          if (
            working.has(s)
          ) {

            if (
              !canWork(
                run[s],
                maxConsecutive
              )
            ) {

              valid = false;
              break;

            }

          }

        }


        if (!valid)
          continue;


        /*
          休日日数を超えないか
        */

        for (
          let s = 0;
          s < staff.length;
          s++
        ) {

          if (
            !working.has(s)
          ) {

            if (
              offCount[s] + 1 >
              offTarget[s]
            ) {

              valid = false;
              break;

            }

          }

        }


        if (!valid)
          continue;


        /*
          残り日数で必要な休みを
          消化できるか
        */

        const remaining =
          days - d - 1;


        for (
          let s = 0;
          s < staff.length;
          s++
        ) {

          const need =
            offTarget[s] -
            (
              offCount[s] +
              (
                working.has(s)
                  ? 0
                  : 1
              )
            );


          if (
            need < 0 ||
            need > remaining
          ) {

            valid = false;
            break;

          }

        }


        if (!valid)
          continue;


        chosen =
          candidate;

        break;

      }


      if (!chosen) {

        failed = true;
        break;

      }


      const working =
        new Set([
          ...chosen.ha,
          ...chosen.hp
        ]);


      /*
        結果反映
      */

      for (
        let s = 0;
        s < staff.length;
        s++
      ) {

        if (
          working.has(s)
        ) {

          if (
            chosen.ha.includes(s)
          ) {

            result[s][d] =
              "HA";

          } else {

            result[s][d] =
              "HP";

          }


          run[s]++;

          previousShift[s] =
            result[s][d];

        }

        else {

          /*
            固定有休・休を維持
          */

          if (
            result[s][d] !== "有休" &&
            result[s][d] !== "休"
          ) {

            result[s][d] =
              "休";

          }

          offCount[s]++;

          run[s] = 0;

          previousShift[s] =
            result[s][d];

        }

      }

    }


    if (failed)
      continue;


    /*
      休日日数が完全一致しているか
    */

    for (
      let s = 0;
      s < staff.length;
      s++
    ) {

      if (
        offCount[s] !==
        offTarget[s]
      ) {

        failed = true;
        break;

      }

    }


    if (failed)
      continue;


    /*
      1日勤務ブロックを評価
    */

    let score = 0;


    for (
      let s = 0;
      s < staff.length;
      s++
    ) {

      for (
        let d = 0;
        d < days;
        d++
      ) {

        const current =
          result[s][d];


        /*
          希望一致
        */

        if (
          requests[s][d] ===
          current
        ) {

          score += 100;

        }


        /*
          HA連続
        */

        if (
          current === "HA" &&
          d > 0 &&
          result[s][d - 1] === "HA"
        ) {

          score += 12;

        }


        /*
          HP連続
        */

        if (
          current === "HP" &&
          d > 0 &&
          result[s][d - 1] === "HP"
        ) {

          score += 12;

        }

      }

    }


    /*
      1日だけ勤務を減点
    */

    for (
      let s = 0;
      s < staff.length;
      s++
    ) {

      for (
        let d = 0;
        d < days;
        d++
      ) {

        if (
          result[s][d] !== "HA" &&
          result[s][d] !== "HP"
        ) {

          continue;

        }


        const before =
          d === 0
            ? (
                previousState[s].consecutive > 0
                  ? true
                  : false
              )
            : (
                result[s][d - 1] === "HA" ||
                result[s][d - 1] === "HP"
              );


        const after =
          d === days - 1
            ? false
            : (
                result[s][d + 1] === "HA" ||
                result[s][d + 1] === "HP"
              );


        if (
          !before &&
          !after
        ) {

          score -= 100;

        }

      }

    }


    /*
      月初の連勤も評価
    */

    for (
      let s = 0;
      s < staff.length;
      s++
    ) {

      if (
        previousState[s].consecutive > 0 &&
        (
          result[s][0] === "HA" ||
          result[s][0] === "HP"
        )
      ) {

        score += 15;

      }

    }


    if (
      score > bestScore
    ) {

      bestScore = score;

      best =
        result;

    }

  }


  if (!best) {

    return {
      error:
        "設定された条件をすべて満たすシフトを作成できませんでした。"
    };

  }


  return {
    schedule: best
  };

}


/* =========================================================
   最終検証
========================================================= */

function validateSchedule(result) {

  const haNeed =
    Number(
      document.getElementById(
        "haNeed"
      ).value
    );

  const hpNeed =
    Number(
      document.getElementById(
        "hpNeed"
      ).value
    );

  const max =
    Number(
      maxConsecutiveSelect.value
    );


  /*
    日別人数
  */

  for (
    let d = 0;
    d < days;
    d++
  ) {

    let ha = 0;
    let hp = 0;

    const working = [];


    for (
      let s = 0;
      s < staff.length;
      s++
    ) {

      if (
        result[s][d] === "HA"
      ) {

        ha++;
        working.push(s);

      }


      if (
        result[s][d] === "HP"
      ) {

        hp++;
        working.push(s);

      }

    }


    if (ha !== haNeed) {

      return `${d + 1}日のHA人数が${haNeed}人ではありません。`;

    }


    if (hp !== hpNeed) {

      return `${d + 1}日のHP人数が${hpNeed}人ではありません。`;

    }


    /*
      レベル
    */

    const hasLevel1 =
      working.some(
        s => staff[s].level === 1
      );

    const hasLevel2 =
      working.some(
        s => staff[s].level === 2
      );


    if (
      hasLevel1 &&
      !hasLevel2
    ) {

      return `${d + 1}日にレベル2スタッフが必要です。`;

    }

  }


  /*
    連勤
    */

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    let run =
      Number(
        previousState[s].consecutive
      ) || 0;


    for (
      let d = 0;
      d < days;
      d++
    ) {

      const working =
        result[s][d] === "HA" ||
        result[s][d] === "HP";


      if (working) {

        run++;


        if (
          run > max
        ) {

          return `${staff[s].name}さんが${max}連勤を超えています。`;

        }

      } else {

        run = 0;

      }

    }

  }


  /*
    HP→翌日HA
  */

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    /*
      前月末HP→今月1日HA
    */

    if (
      previousState[s].shift === "HP" &&
      result[s][0] === "HA"
    ) {

      return `${staff[s].name}さんが前月末HP→今月1日HAになっています。`;

    }


    for (
      let d = 0;
      d < days - 1;
      d++
    ) {

      if (
        result[s][d] === "HP" &&
        result[s][d + 1] === "HA"
      ) {

        return `${staff[s].name}さんがHPの翌日にHAになっています。`;

      }

    }

  }


  /*
    希望休
  */

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    for (
      let d = 0;
      d < days;
      d++
    ) {

      if (
        requests[s][d] === "休" &&
        result[s][d] !== "休"
      ) {

        return `${staff[s].name}さんの${d + 1}日休希望が反映されていません。`;

      }


      if (
        requests[s][d] === "有休" &&
        result[s][d] !== "有休"
      ) {

        return `${staff[s].name}さんの${d + 1}日有休希望が反映されていません。`;

      }

    }

  }


  return "";

}


/* =========================================================
   結果表示
========================================================= */

function renderResult() {

  const card =
    document.getElementById(
      "resultCard"
    );

  const head =
    document.getElementById(
      "resultHead"
    );

  const body =
    document.getElementById(
      "resultBody"
    );


  card.classList.remove(
    "hidden"
  );


  let header =
    "<tr><th>名前</th>";


  for (
    let d = 0;
    d < days;
    d++
  ) {

    header += `
      <th>
        ${d + 1}日
      </th>
    `;

  }


  header += "</tr>";

  head.innerHTML =
    header;


  body.innerHTML = "";


  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    let row =
      `<tr>
        <td>
          ${escapeHtml(
            staff[s].name
          )}
        </td>`;


    for (
      let d = 0;
      d < days;
      d++
    ) {

      const value =
        schedule[s][d];


      let cls =
        "shift-rest";


      if (
        value === "HA"
      ) {

        cls =
          "shift-ha";

      }


      if (
        value === "HP"
      ) {

        cls =
          "shift-hp";

      }


      if (
        value === "有休"
      ) {

        cls =
          "shift-paid";

      }


      let mark = "";


      if (
        requests[s][d] === "HA"
      ) {

        mark =
          `<span class="request-mark">
            HA希望
          </span>`;

      }


      if (
        requests[s][d] === "HP"
      ) {

        mark =
          `<span class="request-mark">
            HP希望
          </span>`;

      }


      if (
        requests[s][d] === "休"
      ) {

        mark =
          `<span class="request-mark">
            休希望
          </span>`;

      }


      if (
        requests[s][d] === "有休"
      ) {

        mark =
          `<span class="request-mark">
            有休
          </span>`;

      }


      row += `
        <td class="${cls}">
          ${value}
          ${mark}
        </td>
      `;

    }


    row += "</tr>";

    body.innerHTML += row;

  }

}


/* =========================================================
   作成ボタン
========================================================= */

document.getElementById(
  "generateBtn"
).addEventListener(
  "click",
  () => {

    const message =
      document.getElementById(
        "message"
      );


    message.innerHTML = `
      <div class="success">
        シフトを作成しています……<br>
        条件を確認しながら自動作成しています。
      </div>
    `;


    /*
      iPhone Safariに画面更新をさせる
    */

    setTimeout(() => {

      try {

        const requestError =
          validateRequests();


        if (
          requestError
        ) {

          message.innerHTML = `
            <div class="error">
              ${escapeHtml(
                requestError
              )}
            </div>
          `;

          return;

        }


        const result =
          generateSchedule();


        if (
          result.error
        ) {

          message.innerHTML = `
            <div class="error">
              ${escapeHtml(
                result.error
              )}
              <br><br>
              公休数・有休数・希望休・最大連勤・
              前月末の状態などの組み合わせによって、
              条件を満たせない場合があります。
            </div>
          `;

          return;

        }


        schedule =
          result.schedule;


        const finalError =
          validateSchedule(
            schedule
          );


        if (
          finalError
        ) {

          message.innerHTML = `
            <div class="error">
              ${escapeHtml(
                finalError
              )}
            </div>
          `;

          return;

        }


        renderResult();


        message.innerHTML = `
          <div class="success">
            シフトを作成しました！
          </div>
        `;


        /*
          結果までスクロール
        */

        document.getElementById(
          "resultCard"
        ).scrollIntoView({
          behavior: "smooth"
        });


      } catch (error) {

        console.error(error);


        message.innerHTML = `
          <div class="error">
            シフト作成中にエラーが発生しました。<br>
            ページを再読み込みして、
            もう一度試してください。
          </div>
        `;

      }

    }, 50);

  }
);


/* =========================================================
   リセット
========================================================= */

document.getElementById(
  "resetBtn"
).addEventListener(
  "click",
  () => {

    requests = [];


    for (
      let s = 0;
      s < staff.length;
      s++
    ) {

      requests[s] =
        new Array(days)
          .fill("");

    }


    renderRequests();


    document.getElementById(
      "message"
    ).innerHTML = "";


    document.getElementById(
      "resultCard"
    ).classList.add(
      "hidden"
    );

  }
);

   初期化
========================================================= */

days =
  getDaysInSelectedMonth();

document.getElementById(
  "daysLabel"
).textContent = days;


createStaff();

createRequests();

renderAll();
