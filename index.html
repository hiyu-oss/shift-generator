<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シフト自動作成</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  background: #f5f6f8;
  color: #222;
}

.container {
  max-width: 1400px;
  margin: auto;
  padding: 16px;
}

h1 {
  font-size: 24px;
  margin: 5px 0 20px;
}

h2 {
  font-size: 18px;
  margin: 25px 0 12px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

label {
  font-size: 14px;
  font-weight: 600;
}

input,
select,
button {
  font-size: 16px;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

input[type="number"] {
  width: 90px;
}

input[type="text"] {
  width: 130px;
}

select {
  background: white;
}

button {
  border: none;
  background: #333;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button.primary {
  background: #1677ff;
  width: 100%;
  padding: 13px;
  font-size: 18px;
}

button.danger {
  background: #e53935;
}

.small {
  font-size: 12px;
  color: #666;
}

.warning {
  color: #c62828;
  font-weight: bold;
  margin-top: 8px;
}

.staff-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
  gap: 10px;
}

.staff-card {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 10px;
}

.staff-title {
  font-weight: bold;
  margin-bottom: 8px;
}

.request-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.request-table,
.result-table {
  border-collapse: collapse;
  white-space: nowrap;
}

.request-table th,
.request-table td,
.result-table th,
.result-table td {
  border: 1px solid #ccc;
  text-align: center;
}

.request-table th,
.request-table td {
  padding: 3px;
}

.request-table th:first-child,
.request-table td:first-child {
  position: sticky;
  left: 0;
  background: white;
  z-index: 3;
  min-width: 90px;
}

.date-head {
  min-width: 72px;
}

.request-select {
  width: 72px;
  padding: 5px 2px;
  font-size: 13px;
}

.request-none {
  background: white;
}

.request-ha {
  background: #dbeafe;
}

.request-hp {
  background: #eadcff;
}

.request-rest {
  background: #ffd9d9;
}

.request-paid {
  background: #ffe7b3;
}

.result-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.result-table th,
.result-table td {
  min-width: 62px;
  height: 48px;
  padding: 4px;
}

.result-table th:first-child,
.result-table td:first-child {
  position: sticky;
  left: 0;
  background: white;
  z-index: 3;
  min-width: 90px;
}

.shift-ha {
  background: #dbeafe;
  font-weight: bold;
}

.shift-hp {
  background: #eadcff;
  font-weight: bold;
}

.shift-rest {
  background: #eee;
}

.shift-paid {
  background: #ffe7b3;
  font-weight: bold;
}

.request-mark {
  display: block;
  font-size: 10px;
  margin-top: 2px;
  opacity: .75;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 13px;
  margin-top: 10px;
}

.legend span {
  padding: 5px 8px;
  border-radius: 6px;
}

.hidden {
  display: none;
}

.success {
  background: #e8f5e9;
  border: 1px solid #81c784;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 10px;
}

.error {
  background: #ffebee;
  border: 1px solid #ef9a9a;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="container">

<h1>シフト自動作成</h1>

<div class="card">

  <h2>基本設定</h2>

  <div class="row">

    <div>
      <label>年</label><br>
      <select id="year"></select>
    </div>

    <div>
      <label>月</label><br>
      <select id="month"></select>
    </div>

    <div>
      <label>人数</label><br>
      <select id="staffCount">
        <option value="1">1人</option>
        <option value="2">2人</option>
        <option value="3">3人</option>
        <option value="4">4人</option>
        <option value="5">5人</option>
        <option value="6">6人</option>
        <option value="7">7人</option>
        <option value="8">8人</option>
        <option value="9">9人</option>
        <option value="10" selected>10人</option>
      </select>
    </div>

    <div>
      <label>最大連勤</label><br>
      <select id="maxConsecutive">
        <option value="2">2連勤</option>
        <option value="3" selected>3連勤</option>
        <option value="4">4連勤</option>
        <option value="5">5連勤</option>
        <option value="6">6連勤</option>
      </select>
    </div>

  </div>

  <p class="small">
    ※最大連勤は、通常の勤務連続日数の上限です。
  </p>

</div>


<div class="card">

  <h2>1日の必要人数</h2>

  <div class="row">

    <div>
      <label>HA</label><br>
      <input type="number" id="haNeed" value="3" min="0" max="10">
    </div>

    <div>
      <label>HP</label><br>
      <input type="number" id="hpNeed" value="2" min="0" max="10">
    </div>

  </div>

</div>


<div class="card">

  <h2>スタッフ設定</h2>

  <div id="staffContainer" class="staff-grid"></div>

</div>


<div class="card">

  <h2>希望入力</h2>

  <div class="small">
    未指定 / HA希望 / HP希望 / 休 / 有休
  </div>

  <br>

  <div class="request-wrap">
    <table class="request-table">
      <thead id="requestHead"></thead>
      <tbody id="requestBody"></tbody>
    </table>
  </div>

  <div class="legend">
    <span class="request-ha">HA希望</span>
    <span class="request-hp">HP希望</span>
    <span class="request-rest">休希望</span>
    <span class="request-paid">有休</span>
  </div>

</div>


<div class="card">

  <button class="primary" id="generateBtn">
    シフトを作成する
  </button>

  <br><br>

  <button class="danger" id="resetBtn">
    希望入力をリセット
  </button>

</div>


<div id="message"></div>


<div class="card hidden" id="resultCard">

  <h2>作成結果</h2>

  <div class="result-wrap">
    <table class="result-table">
      <thead id="resultHead"></thead>
      <tbody id="resultBody"></tbody>
    </table>
  </div>

  <div class="legend">
    <span class="shift-ha">HA</span>
    <span class="shift-hp">HP</span>
    <span class="shift-rest">休</span>
    <span class="shift-paid">有休</span>
  </div>

</div>

</div>


<script>

let days = 30;
let staff = [];
let requests = [];
let schedule = [];


/* =========================
   初期設定
========================= */

const yearSelect = document.getElementById("year");
const monthSelect = document.getElementById("month");
const staffCountSelect = document.getElementById("staffCount");

const now = new Date();

for (let y = now.getFullYear() - 1; y <= now.getFullYear() + 3; y++) {
  const option = document.createElement("option");
  option.value = y;
  option.textContent = y + "年";

  if (y === now.getFullYear()) {
    option.selected = true;
  }

  yearSelect.appendChild(option);
}

for (let m = 1; m <= 12; m++) {
  const option = document.createElement("option");
  option.value = m;
  option.textContent = m + "月";

  if (m === now.getMonth() + 1) {
    option.selected = true;
  }

  monthSelect.appendChild(option);
}


/* =========================
   月の日数
========================= */

function getDaysInMonth() {
  const year = Number(yearSelect.value);
  const month = Number(monthSelect.value);

  return new Date(year, month, 0).getDate();
}


/* =========================
   スタッフ初期値
========================= */

function createDefaultStaff() {

  const count = Number(staffCountSelect.value);

  const old = staff;

  staff = [];

  for (let i = 0; i < count; i++) {

    staff.push({
      name: old[i]?.name || String.fromCharCode(65 + i),
      level: old[i]?.level || 2,
      publicHoliday: old[i]?.publicHoliday ?? 11,
      paidLeave: old[i]?.paidLeave ?? 0
    });

  }

}


/* =========================
   希望初期値
========================= */

function createRequests() {

  const old = requests;

  requests = [];

  for (let s = 0; s < staff.length; s++) {

    requests[s] = [];

    for (let d = 0; d < days; d++) {

      requests[s][d] =
        old[s]?.[d] || "";

    }

  }

}


/* =========================
   画面更新
========================= */

function rebuildUI() {

  days = getDaysInMonth();

  createDefaultStaff();
  createRequests();

  renderStaff();
  renderRequests();

}


function renderStaff() {

  const container = document.getElementById("staffContainer");

  container.innerHTML = "";

  staff.forEach((person, i) => {

    const div = document.createElement("div");

    div.className = "staff-card";

    div.innerHTML = `
      <div class="staff-title">
        スタッフ${i + 1}
      </div>

      <div class="row">

        <div>
          <label>名前</label><br>
          <input
            type="text"
            value="${escapeHtml(person.name)}"
            data-staff="${i}"
            data-field="name"
          >
        </div>

        <div>
          <label>レベル</label><br>
          <select
            data-staff="${i}"
            data-field="level"
          >
            <option value="1" ${person.level == 1 ? "selected" : ""}>
              1：研修中
            </option>
            <option value="2" ${person.level == 2 ? "selected" : ""}>
              2：独り立ち
            </option>
          </select>
        </div>

        <div>
          <label>公休</label><br>
          <input
            type="number"
            min="0"
            max="${days}"
            value="${Math.min(person.publicHoliday, days)}"
            data-staff="${i}"
            data-field="publicHoliday"
          >
        </div>

        <div>
          <label>有休</label><br>
          <input
            type="number"
            min="0"
            max="${days}"
            value="${Math.min(person.paidLeave, days)}"
            data-staff="${i}"
            data-field="paidLeave"
          >
        </div>

      </div>
    `;

    container.appendChild(div);

  });

}


function renderRequests() {

  const head = document.getElementById("requestHead");
  const body = document.getElementById("requestBody");

  head.innerHTML = "";
  body.innerHTML = "";

  let h = "<tr><th>名前</th>";

  for (let d = 0; d < days; d++) {

    h += `
      <th class="date-head">
        ${d + 1}日
      </th>
    `;

  }

  h += "</tr>";

  head.innerHTML = h;


  staff.forEach((person, s) => {

    let row = `
      <tr>
        <td>${escapeHtml(person.name)}</td>
    `;

    for (let d = 0; d < days; d++) {

      const value = requests[s][d];

      let cls = "request-none";

      if (value === "HA") cls = "request-ha";
      if (value === "HP") cls = "request-hp";
      if (value === "休") cls = "request-rest";
      if (value === "有休") cls = "request-paid";

      row += `
        <td class="${cls}">
          <select
            class="request-select"
            data-s="${s}"
            data-d="${d}"
          >
            <option value="" ${value === "" ? "selected" : ""}>
              -
            </option>

            <option value="HA" ${value === "HA" ? "selected" : ""}>
              HA希望
            </option>

            <option value="HP" ${value === "HP" ? "selected" : ""}>
              HP希望
            </option>

            <option value="休" ${value === "休" ? "selected" : ""}>
              休
            </option>

            <option value="有休" ${value === "有休" ? "selected" : ""}>
              有休
            </option>
          </select>
        </td>
      `;

    }

    row += "</tr>";

    body.innerHTML += row;

  });

}


/* =========================
   入力イベント
========================= */

document.addEventListener("change", e => {

  const target = e.target;

  if (target.dataset.staff !== undefined) {

    const i = Number(target.dataset.staff);
    const field = target.dataset.field;

    if (field === "name") {
      staff[i].name = target.value || String.fromCharCode(65 + i);
    }

    if (field === "level") {
      staff[i].level = Number(target.value);
    }

    if (field === "publicHoliday") {
      staff[i].publicHoliday =
        Math.max(0, Math.min(days, Number(target.value) || 0));
    }

    if (field === "paidLeave") {
      staff[i].paidLeave =
        Math.max(0, Math.min(days, Number(target.value) || 0));
    }

    if (field === "name") {
      renderRequests();
    }

  }


  if (target.classList.contains("request-select")) {

    const s = Number(target.dataset.s);
    const d = Number(target.dataset.d);

    requests[s][d] = target.value;

    updateRequestCell(target);

  }

});


function updateRequestCell(select) {

  const td = select.closest("td");

  td.className = "request-none";

  if (select.value === "HA") {
    td.className = "request-ha";
  }

  if (select.value === "HP") {
    td.className = "request-hp";
  }

  if (select.value === "休") {
    td.className = "request-rest";
  }

  if (select.value === "有休") {
    td.className = "request-paid";
  }

}


/* =========================
   月・人数変更
========================= */

monthSelect.addEventListener("change", () => {

  const oldDays = days;

  days = getDaysInMonth();

  createDefaultStaff();

  const oldRequests = requests;

  requests = [];

  for (let s = 0; s < staff.length; s++) {

    requests[s] = [];

    for (let d = 0; d < days; d++) {

      requests[s][d] =
        oldRequests[s]?.[d] || "";

    }

  }

  renderStaff();
  renderRequests();

});


yearSelect.addEventListener("change", () => {

  days = getDaysInMonth();

  createDefaultStaff();

  const oldRequests = requests;

  requests = [];

  for (let s = 0; s < staff.length; s++) {

    requests[s] = [];

    for (let d = 0; d < days; d++) {

      requests[s][d] =
        oldRequests[s]?.[d] || "";

    }

  }

  renderStaff();
  renderRequests();

});


staffCountSelect.addEventListener("change", () => {

  createDefaultStaff();
  createRequests();

  renderStaff();
  renderRequests();

});


/* =========================
   ユーティリティ
========================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function shuffle(array) {

  const a = [...array];

  for (let i = a.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [a[i], a[j]] = [a[j], a[i]];

  }

  return a;

}


/* =========================
   希望休チェック
========================= */

function validateRequests() {

  for (let s = 0; s < staff.length; s++) {

    let paid = 0;
    let rest = 0;

    for (let d = 0; d < days; d++) {

      if (requests[s][d] === "有休") paid++;
      if (requests[s][d] === "休") rest++;

    }

    if (paid > staff[s].paidLeave) {

      return `${staff[s].name}さんの有休希望が、設定した有休数を超えています。`;

    }

    if (paid + rest > staff[s].publicHoliday + staff[s].paidLeave) {

      return `${staff[s].name}さんの休み希望が多すぎます。`;

    }

  }

  return "";

}


/* =========================
   勤務パターン作成
========================= */

function createWorkPattern(personIndex) {

  const person = staff[personIndex];

  const fixedOff = new Array(days).fill(false);

  let paidCount = 0;

  for (let d = 0; d < days; d++) {

    if (
      requests[personIndex][d] === "休" ||
      requests[personIndex][d] === "有休"
    ) {

      fixedOff[d] = true;

    }

    if (requests[personIndex][d] === "有休") {
      paidCount++;
    }

  }

  const targetOff =
    Math.max(
      fixedOff.filter(Boolean).length,
      person.publicHoliday + person.paidLeave
    );

  if (targetOff > days) {
    return null;
  }


  let best = null;
  let bestScore = -Infinity;


  for (let attempt = 0; attempt < 250; attempt++) {

    const off = [...fixedOff];

    let offCount = off.filter(Boolean).length;

    const candidates = [];

    for (let d = 0; d < days; d++) {

      if (!off[d]) {
        candidates.push(d);
      }

    }

    const shuffled = shuffle(candidates);


    /*
      希望HA/HPの日はできるだけ勤務日にする。
      休・有休は固定。
    */

    shuffled.sort((a, b) => {

      const ra = requests[personIndex][a];
      const rb = requests[personIndex][b];

      const va =
        ra === "HA" || ra === "HP" ? 10 : 0;

      const vb =
        rb === "HA" || rb === "HP" ? 10 : 0;

      return va - vb;

    });


    while (offCount < targetOff && shuffled.length) {

      const d = shuffled.shift();

      /*
        できるだけ勤務ブロックを壊さない休みを優先
      */

      let score = Math.random() * 10;

      if (d > 0 && !off[d - 1]) score += 4;
      if (d < days - 1 && !off[d + 1]) score += 4;

      if (requests[personIndex][d] === "HA") {
        score -= 30;
      }

      if (requests[personIndex][d] === "HP") {
        score -= 30;
      }

      if (score > -100) {
        off[d] = true;
        offCount++;
      }

    }


    /*
      勤務日を作る
    */

    const work = off.map(x => !x);


    /*
      最大連勤チェック
    */

    const maxConsecutive =
      Number(document.getElementById("maxConsecutive").value);

    let run = 0;
    let valid = true;

    for (let d = 0; d < days; d++) {

      if (work[d]) {

        run++;

        if (run > maxConsecutive) {
          valid = false;
          break;
        }

      } else {

        run = 0;

      }

    }

    if (!valid) continue;


    /*
      1日だけの勤務ブロックを減点
    */

    let score = 0;

    for (let d = 0; d < days; d++) {

      if (!work[d]) continue;

      const before =
        d === 0 ? false : work[d - 1];

      const after =
        d === days - 1 ? false : work[d + 1];

      if (!before && !after) {
        score -= 100;
      }

      if (before) score += 5;
      if (after) score += 5;

      if (
        requests[personIndex][d] === "HA" ||
        requests[personIndex][d] === "HP"
      ) {
        score += 50;
      }

    }


    /*
      希望休を大きく優先
    */

    for (let d = 0; d < days; d++) {

      if (requests[personIndex][d] === "休" ||
          requests[personIndex][d] === "有休") {

        if (work[d]) score -= 1000;

      }

    }


    if (score > bestScore) {

      bestScore = score;

      best = {
        work,
        off
      };

    }

  }


  return best;
}


/* =========================
   全員の勤務パターン生成
========================= */

function generateWorkPatterns() {

  const patterns = [];

  for (let s = 0; s < staff.length; s++) {

    const p = createWorkPattern(s);

    if (!p) {
      return null;
    }

    patterns.push(p);

  }

  return patterns;

}


/* =========================
   日別人数チェック
========================= */

function getWorkers(patterns, d) {

  const result = [];

  for (let s = 0; s < staff.length; s++) {

    if (patterns[s].work[d]) {

      result.push(s);

    }

  }

  return result;

}


/* =========================
   シフト割当
========================= */

function assignShifts(patterns) {

  const haNeed =
    Number(document.getElementById("haNeed").value);

  const hpNeed =
    Number(document.getElementById("hpNeed").value);

  const required =
    haNeed + hpNeed;


  if (staff.length < required) {

    return {
      error:
        `スタッフが${staff.length}人しかいません。` +
        `HA${haNeed}人＋HP${hpNeed}人で` +
        `最低${required}人必要です。`
    };

  }


  /*
    各日の勤務者を作成
  */

  for (let d = 0; d < days; d++) {

    const workers = getWorkers(patterns, d);

    if (workers.length < required) {

      return {
        error:
          `${d + 1}日に勤務可能な人が${workers.length}人しかいません。` +
          `最低${required}人必要です。`
      };

    }

  }


  const result = [];

  for (let s = 0; s < staff.length; s++) {

    result[s] = new Array(days).fill("休");

  }


  /*
    まず全勤務者を一旦勤務状態として扱う。
    実際のHA/HPは必要人数分だけ割り当てる。
  */

  const previousShift =
    new Array(staff.length).fill("休");


  for (let d = 0; d < days; d++) {

    const workers = getWorkers(patterns, d);

    const candidates = shuffle(workers);


    /*
      HP→翌日HA禁止のため、
      前日HPだった人はHA候補から外す。
    */

    let hpCandidates = [...candidates];

    let haCandidates = candidates.filter(s =>
      previousShift[s] !== "HP"
    );


    /*
      レベル1しかいない日を避ける。
    */

    function hasLevel2(arr) {

      return arr.some(s => staff[s].level === 2);

    }


    let selectedHA = [];
    let selectedHP = [];


    /*
      希望を優先する関数
    */

    function preferenceScore(s, type) {

      const r = requests[s][d];

      if (r === type) return 100;
      if (r === "休" || r === "有休") return -10000;

      return 0;

    }


    haCandidates.sort((a, b) =>
      preferenceScore(b, "HA") -
      preferenceScore(a, "HA")
    );


    /*
      HA
    */

    for (const s of haCandidates) {

      if (selectedHA.length >= haNeed) break;

      if (
        requests[s][d] === "休" ||
        requests[s][d] === "有休"
      ) {
        continue;
      }

      selectedHA.push(s);

    }


    /*
      HP
    */

    hpCandidates.sort((a, b) =>
      preferenceScore(b, "HP") -
      preferenceScore(a, "HP")
    );


    for (const s of hpCandidates) {

      if (selectedHP.length >= hpNeed) break;

      if (
        selectedHA.includes(s)
      ) continue;

      if (
        requests[s][d] === "休" ||
        requests[s][d] === "有休"
      ) {
        continue;
      }

      selectedHP.push(s);

    }


    /*
      人数不足の場合は再探索
    */

    if (
      selectedHA.length < haNeed ||
      selectedHP.length < hpNeed
    ) {

      return {
        error:
          `${d + 1}日の希望条件を満たせませんでした。`
      };

    }


    /*
      レベル1が勤務するならレベル2も勤務
    */

    const working =
      [...selectedHA, ...selectedHP];

    const level1Working =
      working.some(s => staff[s].level === 1);

    const level2Working =
      working.some(s => staff[s].level === 2);


    if (level1Working && !level2Working) {

      /*
        レベル2の人を探して入れ替える
      */

      const availableLevel2 =
        workers.filter(s =>
          staff[s].level === 2 &&
          !selectedHA.includes(s) &&
          !selectedHP.includes(s) &&
          requests[s][d] !== "休" &&
          requests[s][d] !== "有休"
        );


      if (availableLevel2.length === 0) {

        return {
          error:
            `${d + 1}日にレベル2のスタッフが必要です。`
        };

      }


      const replaceIndex =
        selectedHA.findIndex(s => staff[s].level === 1);

      if (replaceIndex >= 0) {

        selectedHA[replaceIndex] =
          availableLevel2[0];

      } else {

        const replaceIndexHP =
          selectedHP.findIndex(s => staff[s].level === 1);

        if (replaceIndexHP >= 0) {

          selectedHP[replaceIndexHP] =
            availableLevel2[0];

        }

      }

    }


    /*
      結果に反映
    */

    for (const s of workers) {

      if (requests[s][d] === "有休") {

        result[s][d] = "有休";

      } else if (requests[s][d] === "休") {

        result[s][d] = "休";

      } else {

        result[s][d] = "休";

      }

    }


    for (const s of selectedHA) {
      result[s][d] = "HA";
      previousShift[s] = "HA";
    }

    for (const s of selectedHP) {
      result[s][d] = "HP";
      previousShift[s] = "HP";
    }


    for (const s of workers) {

      if (
        !selectedHA.includes(s) &&
        !selectedHP.includes(s)
      ) {

        previousShift[s] = "休";

      }

    }

  }


  return {
    schedule: result
  };

}


/* =========================
   希望休を強制反映する改善処理
========================= */

function forceRequestedDays(result) {

  for (let s = 0; s < staff.length; s++) {

    for (let d = 0; d < days; d++) {

      const r = requests[s][d];

      if (r === "有休") {

        result[s][d] = "有休";

      }

      if (r === "休") {

        result[s][d] = "休";

      }

    }

  }

}


/* =========================
   最終チェック
========================= */

function validateSchedule(result) {

  const haNeed =
    Number(document.getElementById("haNeed").value);

  const hpNeed =
    Number(document.getElementById("hpNeed").value);

  const maxConsecutive =
    Number(document.getElementById("maxConsecutive").value);


  for (let d = 0; d < days; d++) {

    let ha = 0;
    let hp = 0;

    const working = [];

    for (let s = 0; s < staff.length; s++) {

      if (result[s][d] === "HA") {
        ha++;
        working.push(s);
      }

      if (result[s][d] === "HP") {
        hp++;
        working.push(s);
      }

    }


    if (ha !== haNeed) {
      return `${d + 1}日のHA人数が${haNeed}人になっていません。`;
    }

    if (hp !== hpNeed) {
      return `${d + 1}日のHP人数が${hpNeed}人になっていません。`;
    }


    /*
      レベル1勤務時はレベル2勤務必須
    */

    if (
      working.some(s => staff[s].level === 1) &&
      !working.some(s => staff[s].level === 2)
    ) {

      return `${d + 1}日にレベル2スタッフが必要です。`;

    }

  }


  /*
    連勤チェック
  */

  for (let s = 0; s < staff.length; s++) {

    let run = 0;

    for (let d = 0; d < days; d++) {

      const working =
        result[s][d] === "HA" ||
        result[s][d] === "HP";

      if (working) {

        run++;

        if (run > maxConsecutive) {

          return `${staff[s].name}さんが${maxConsecutive}連勤を超えています。`;

        }

      } else {

        run = 0;

      }

    }

  }


  /*
    HP→翌日HAチェック
  */

  for (let s = 0; s < staff.length; s++) {

    for (let d = 0; d < days - 1; d++) {

      if (
        result[s][d] === "HP" &&
        result[s][d + 1] === "HA"
      ) {

        return `${staff[s].name}さんがHPの翌日にHAになっています。`;

      }

    }

  }


  return "";

}


/* =========================
   メイン生成
========================= */

document.getElementById("generateBtn").addEventListener("click", () => {

  const message = document.getElementById("message");

  message.innerHTML =
    `<div class="success">シフトを作成しています……</div>`;

  /*
    iPhone Safariが画面を更新する時間を確保
  */

  setTimeout(() => {

    try {

      const requestError = validateRequests();

      if (requestError) {

        message.innerHTML =
          `<div class="error">${escapeHtml(requestError)}</div>`;

        return;

      }


      const required =
        Number(document.getElementById("haNeed").value) +
        Number(document.getElementById("hpNeed").value);


      if (staff.length < required) {

        message.innerHTML =
          `<div class="error">
            スタッフが${staff.length}人しかいません。<br>
            必要人数は${required}人です。
          </div>`;

        return;

      }


      let best = null;
      let bestScore = -Infinity;


      /*
        何回かパターンを作り、
        一番良いものを採用。
        無限ループにはしない。
      */

      for (let attempt = 0; attempt < 80; attempt++) {

        const patterns =
          generateWorkPatterns();

        if (!patterns) continue;


        /*
          各日の最低人数チェック
        */

        let validCoverage = true;

        for (let d = 0; d < days; d++) {

          const workers =
            getWorkers(patterns, d);

          if (workers.length < required) {

            validCoverage = false;
            break;

          }

        }

        if (!validCoverage) continue;


        const assigned =
          assignShifts(patterns);

        if (assigned.error) continue;


        const candidate =
          assigned.schedule;


        /*
          希望を点数化
        */

        let score = 0;

        for (let s = 0; s < staff.length; s++) {

          for (let d = 0; d < days; d++) {

            const r = requests[s][d];
            const actual = candidate[s][d];

            if (r === "休" && actual === "休") {
              score += 100;
            }

            if (r === "有休" && actual === "有休") {
              score += 200;
            }

            if (r === "HA" && actual === "HA") {
              score += 80;
            }

            if (r === "HP" && actual === "HP") {
              score += 80;
            }

          }

        }


        /*
          HA/HPの連続性を加点
        */

        for (let s = 0; s < staff.length; s++) {

          for (let d = 0; d < days - 1; d++) {

            if (
              candidate[s][d] !== "休" &&
              candidate[s][d] !== "有休" &&
              candidate[s][d] === candidate[s][d + 1]
            ) {

              score += 5;

            }

          }

        }


        if (score > bestScore) {

          bestScore = score;

          best = candidate;

        }

      }


      if (!best) {

        message.innerHTML =
          `<div class="error">
            条件をすべて満たすシフトを作成できませんでした。<br><br>
            ・人数が少なすぎないか<br>
            ・公休数が多すぎないか<br>
            ・希望休が集中していないか<br>
            ・最大連勤を短くしすぎていないか<br>
            を確認してください。
          </div>`;

        return;

      }


      forceRequestedDays(best);


      const finalError =
        validateSchedule(best);


      if (finalError) {

        message.innerHTML =
          `<div class="error">
            ${escapeHtml(finalError)}
          </div>`;

        return;

      }


      schedule = best;

      renderResult();

      message.innerHTML =
        `<div class="success">
          シフトを作成しました！
        </div>`;

    } catch (error) {

      console.error(error);

      message.innerHTML =
        `<div class="error">
          シフト作成中にエラーが発生しました。<br>
          ページを再読み込みして、もう一度試してください。
        </div>`;

    }

  }, 50);

});


/* =========================
   結果表示
========================= */

function renderResult() {

  const card =
    document.getElementById("resultCard");

  const head =
    document.getElementById("resultHead");

  const body =
    document.getElementById("resultBody");


  card.classList.remove("hidden");


  let h = "<tr><th>名前</th>";

  for (let d = 0; d < days; d++) {

    h += `<th>${d + 1}日</th>`;

  }

  h += "</tr>";

  head.innerHTML = h;


  body.innerHTML = "";


  for (let s = 0; s < staff.length; s++) {

    let row =
      `<tr><td>${escapeHtml(staff[s].name)}</td>`;


    for (let d = 0; d < days; d++) {

      const value =
        schedule[s][d];

      let cls = "shift-rest";

      if (value === "HA") {
        cls = "shift-ha";
      }

      if (value === "HP") {
        cls = "shift-hp";
      }

      if (value === "有休") {
        cls = "shift-paid";
      }


      let mark = "";

      if (requests[s][d] === "HA") {
        mark = `<span class="request-mark">HA希望</span>`;
      }

      if (requests[s][d] === "HP") {
        mark = `<span class="request-mark">HP希望</span>`;
      }

      if (requests[s][d] === "休") {
        mark = `<span class="request-mark">休希望</span>`;
      }

      if (requests[s][d] === "有休") {
        mark = `<span class="request-mark">有休</span>`;
      }


      row += `
        <td class="${cls}">
          ${value}
          ${mark}
        </td>
      `;

    }

    row += "</tr>";

    body.innerHTML += row;

  }

}


/* =========================
   リセット
========================= */

document.getElementById("resetBtn").addEventListener("click", () => {

  requests = [];

  for (let s = 0; s < staff.length; s++) {

    requests[s] = new Array(days).fill("");

  }

  renderRequests();

  document.getElementById("message").innerHTML = "";

  document.getElementById("resultCard")
    .classList.add("hidden");

});


/* =========================
   初回起動
========================= */

rebuildUI();

</script>
