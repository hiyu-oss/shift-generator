<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シフト自動作成</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f6f8;
  color: #222;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
               Arial, sans-serif;
}

.container {
  max-width: 1500px;
  margin: auto;
  padding: 15px;
}

h1 {
  font-size: 24px;
  margin: 5px 0 20px;
}

h2 {
  font-size: 18px;
  margin: 20px 0 12px;
}

.card {
  background: #fff;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: flex-start;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

label {
  font-size: 13px;
  font-weight: bold;
}

input,
select,
button {
  font-size: 16px;
  border-radius: 8px;
}

input,
select {
  padding: 8px;
  border: 1px solid #ccc;
  background: white;
}

input[type="text"] {
  width: 130px;
}

input[type="number"] {
  width: 90px;
}

button {
  border: 0;
  padding: 11px 15px;
  color: white;
  background: #333;
  font-weight: bold;
}

button.primary {
  width: 100%;
  background: #1677ff;
  font-size: 18px;
  padding: 14px;
}

button.danger {
  background: #e53935;
}

.small {
  font-size: 12px;
  color: #666;
  line-height: 1.6;
}

.info {
  background: #eef6ff;
  border: 1px solid #b8d9ff;
  padding: 10px;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.6;
}

.warning {
  background: #fff8e1;
  border: 1px solid #ffd54f;
  padding: 10px;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.6;
}

.success {
  background: #e8f5e9;
  border: 1px solid #81c784;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 12px;
}

.error {
  background: #ffebee;
  border: 1px solid #ef9a9a;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 12px;
  line-height: 1.6;
}

.staff-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 10px;
}

.staff-card {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 12px;
}

.staff-title {
  font-weight: bold;
  margin-bottom: 10px;
}

.scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

table {
  border-collapse: collapse;
  white-space: nowrap;
}

th,
td {
  border: 1px solid #ccc;
  text-align: center;
}

.request-table th,
.request-table td {
  padding: 3px;
}

.request-table th:first-child,
.request-table td:first-child,
.result-table th:first-child,
.result-table td:first-child {
  position: sticky;
  left: 0;
  z-index: 5;
  background: white;
  min-width: 90px;
}

.date-head {
  min-width: 65px;
}

.request-select {
  width: 68px;
  padding: 5px 2px;
  font-size: 12px;
}

.request-none {
  background: white;
}

.request-ha {
  background: #dbeafe;
}

.request-hp {
  background: #eadcff;
}

.request-rest {
  background: #ffd9d9;
}

.request-paid {
  background: #ffe7b3;
}

.result-table th,
.result-table td {
  min-width: 62px;
  height: 48px;
  padding: 4px;
}

.shift-ha {
  background: #dbeafe;
  font-weight: bold;
}

.shift-hp {
  background: #eadcff;
  font-weight: bold;
}

.shift-rest {
  background: #eee;
}

.shift-paid {
  background: #ffe7b3;
  font-weight: bold;
}

.request-mark {
  display: block;
  font-size: 9px;
  opacity: .75;
  margin-top: 2px;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 10px;
  font-size: 12px;
}

.legend span {
  padding: 5px 8px;
  border-radius: 6px;
}

.hidden {
  display: none;
}

.month-days {
  font-size: 13px;
  color: #1677ff;
  font-weight: bold;
}

.holiday-info {
  font-size: 13px;
  line-height: 1.6;
  margin-top: 8px;
}

.auto-badge {
  display: inline-block;
  background: #1677ff;
  color: white;
  padding: 3px 7px;
  border-radius: 5px;
  font-size: 11px;
  margin-left: 5px;
}

.manual-badge {
  display: inline-block;
  background: #777;
  color: white;
  padding: 3px 7px;
  border-radius: 5px;
  font-size: 11px;
  margin-left: 5px;
}
</style>
</head>

<body>

<div class="container">

<h1>シフト自動作成</h1>

<!-- =========================
     基本設定
========================= -->

<div class="card">

<h2>基本設定</h2>

<div class="row">

  <div class="field">
    <label>年</label>
    <select id="year"></select>
  </div>

  <div class="field">
    <label>月</label>
    <select id="month"></select>
  </div>

  <div class="field">
    <label>人数</label>
    <select id="staffCount">
      <option value="1">1人</option>
      <option value="2">2人</option>
      <option value="3">3人</option>
      <option value="4">4人</option>
      <option value="5">5人</option>
      <option value="6">6人</option>
      <option value="7">7人</option>
      <option value="8">8人</option>
      <option value="9">9人</option>
      <option value="10" selected>10人</option>
    </select>
  </div>

  <div class="field">
    <label>最大連勤</label>
    <select id="maxConsecutive">
      <option value="2">2連勤</option>
      <option value="3" selected>3連勤</option>
      <option value="4">4連勤</option>
      <option value="5">5連勤</option>
      <option value="6">6連勤</option>
    </select>
  </div>

</div>

<br>

<div class="month-days">
  この月の日数：<span id="daysLabel"></span>日
</div>

<div class="holiday-info">
  土日：<span id="weekendCount">-</span>日　
  祝日：<span id="holidayCount">-</span>日　
  <strong>土日祝：<span id="publicHolidayCount">-</span>日</strong>
</div>

<div id="holidayMessage" class="small">
  祝日情報を取得しています……
</div>

</div>

<!-- =========================
     前月末
========================= -->

<div class="card">

<h2>前月末の状態</h2>

<div class="info">
前月末の勤務状況を入力してください。<br>
これを使って、<strong>月をまたいだ連勤数</strong>と
<strong>HP→翌日HA禁止</strong>を判定します。
</div>

<br>

<div id="previousContainer" class="staff-grid"></div>

</div>

<!-- =========================
     必要人数
========================= -->

<div class="card">

<h2>1日の必要人数</h2>

<div class="row">

  <div class="field">
    <label>HA</label>
    <input type="number" id="haNeed" value="3" min="0" max="10">
  </div>

  <div class="field">
    <label>HP</label>
    <input type="number" id="hpNeed" value="2" min="0" max="10">
  </div>

</div>

</div>

<!-- =========================
     スタッフ
========================= -->

<div class="card">

<h2>スタッフ設定</h2>

<div id="staffContainer" class="staff-grid"></div>

</div>

<!-- =========================
     希望
========================= -->

<div class="card">

<h2>希望入力</h2>

<div class="small">
未指定 / HA希望 / HP希望 / 休 / 有休
</div>

<br>

<div class="scroll">

<table class="request-table">

<thead id="requestHead"></thead>
<tbody id="requestBody"></tbody>

</table>

</div>

<div class="legend">
<span class="request-ha">HA希望</span>
<span class="request-hp">HP希望</span>
<span class="request-rest">休希望</span>
<span class="request-paid">有休</span>
</div>

</div>

<!-- =========================
     作成
========================= -->

<div class="card">

<button class="primary" id="generateBtn">
シフトを作成する
</button>

<br><br>

<button class="danger" id="resetBtn">
希望入力をリセット
</button>

</div>

<div id="message"></div>

<!-- =========================
     結果
========================= -->

<div class="card hidden" id="resultCard">

<h2>作成結果</h2>

<div class="scroll">

<table class="result-table">

<thead id="resultHead"></thead>
<tbody id="resultBody"></tbody>

</table>

</div>

<div class="legend">
<span class="shift-ha">HA</span>
<span class="shift-hp">HP</span>
<span class="shift-rest">休</span>
<span class="shift-paid">有休</span>
</div>

</div>

</div>

<script>

/* =========================================================
   データ
========================================================= */

let days = 0;

let staff = [];
let requests = [];
let previousState = [];

let schedule = [];

let holidayDates = [];

let holidayFetchOK = false;


/* =========================================================
   DOM
========================================================= */

const yearSelect =
  document.getElementById("year");

const monthSelect =
  document.getElementById("month");

const staffCountSelect =
  document.getElementById("staffCount");

const maxConsecutiveSelect =
  document.getElementById("maxConsecutive");


/* =========================================================
   年・月
========================================================= */

const today = new Date();

for (
  let y = today.getFullYear() - 1;
  y <= today.getFullYear() + 5;
  y++
) {

  const option =
    document.createElement("option");

  option.value = y;
  option.textContent = y + "年";

  if (y === today.getFullYear()) {
    option.selected = true;
  }

  yearSelect.appendChild(option);

}

for (let m = 1; m <= 12; m++) {

  const option =
    document.createElement("option");

  option.value = m;
  option.textContent = m + "月";

  if (m === today.getMonth() + 1) {
    option.selected = true;
  }

  monthSelect.appendChild(option);

}


/* =========================================================
   月の日数
========================================================= */

function getDaysInSelectedMonth() {

  const year =
    Number(yearSelect.value);

  const month =
    Number(monthSelect.value);

  return new Date(
    year,
    month,
    0
  ).getDate();

}


/* =========================================================
   土日数
========================================================= */

function getWeekendDates() {

  const year =
    Number(yearSelect.value);

  const month =
    Number(monthSelect.value);

  const result = [];

  for (
    let d = 1;
    d <= days;
    d++
  ) {

    const date =
      new Date(
        year,
        month - 1,
        d
      );

    const day =
      date.getDay();

    if (
      day === 0 ||
      day === 6
    ) {

      result.push(d);

    }

  }

  return result;

}


/* =========================================================
   日本の祝日取得
========================================================= */

async function fetchJapaneseHolidays() {

  const year =
    Number(yearSelect.value);

  holidayDates = [];

  holidayFetchOK = false;

  /*
    Holidays JP の年別JSON。

    例：
    https://holidays-jp.github.io/api/v1/2026/date.json
  */

  const url =
    `https://holidays-jp.github.io/api/v1/${year}/date.json`;

  try {

    const response =
      await fetch(url, {
        cache: "no-store"
      });

    if (!response.ok) {
      throw new Error(
        "祝日データ取得失敗"
      );
    }

    const data =
      await response.json();

    Object.keys(data).forEach(
      dateString => {

        const parts =
          dateString.split("-");

        const y =
          Number(parts[0]);

        const m =
          Number(parts[1]);

        const d =
          Number(parts[2]);

        if (
          y === year &&
          m === Number(monthSelect.value)
        ) {

          holidayDates.push(d);

        }

      }
    );

    holidayFetchOK = true;

  } catch (error) {

    console.error(
      "祝日取得エラー",
      error
    );

    holidayDates = [];

    holidayFetchOK = false;

  }

}


/* =========================================================
   土日＋祝日の公休日数
========================================================= */

function calculatePublicHolidayCount() {

  const weekends =
    getWeekendDates();

  /*
    土日と祝日が重なった日は
    1日として数える。
  */

  const combined =
    new Set([
      ...weekends,
      ...holidayDates
    ]);

  return {
    weekendCount:
      weekends.length,

    holidayCount:
      holidayDates.length,

    publicHolidayCount:
      combined.size,

    dates:
      [...combined].sort(
        (a, b) => a - b
      )
  };

}


/* =========================================================
   公休数表示・反映
========================================================= */

function updatePublicHolidayDisplay() {

  const info =
    calculatePublicHolidayCount();

  document.getElementById(
    "weekendCount"
  ).textContent =
    info.weekendCount;

  document.getElementById(
    "holidayCount"
  ).textContent =
    info.holidayCount;

  document.getElementById(
    "publicHolidayCount"
  ).textContent =
    info.publicHolidayCount;


  const message =
    document.getElementById(
      "holidayMessage"
    );

  if (
    holidayFetchOK
  ) {

    message.innerHTML =
      `日本の祝日を自動取得しました。` +
      `土日と祝日が重なる日は1日として計算しています。`;

  } else {

    message.innerHTML =
      `祝日情報を取得できませんでした。` +
      `現在は土日のみで計算しています。` +
      `インターネット接続を確認してください。`;

  }


  /*
    全スタッフの公休数を自動更新
  */

  const publicHoliday =
    info.publicHolidayCount;

  staff.forEach(person => {

    person.publicHoliday =
      publicHoliday;

  });

}


/* =========================================================
   月変更
========================================================= */

async function changeMonth() {

  const oldRequests =
    requests;

  days =
    getDaysInSelectedMonth();

  document.getElementById(
    "daysLabel"
  ).textContent =
    days;


  /*
    希望入力を可能な範囲で維持
  */

  requests = [];

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    requests[s] = [];

    for (
      let d = 0;
      d < days;
      d++
    ) {

      requests[s][d] =
        oldRequests[s]?.[d] || "";

    }

  }


  /*
    まず祝日を取得
  */

  await fetchJapaneseHolidays();


  /*
    公休数を自動計算
  */

  updatePublicHolidayDisplay();


  renderAll();

}


/* =========================================================
   スタッフ初期値
========================================================= */

function createStaff() {

  const count =
    Number(staffCountSelect.value);

  const oldStaff =
    staff;

  const oldPrevious =
    previousState;

  const currentPublicHoliday =
    calculatePublicHolidayCount()
      .publicHolidayCount;

  staff = [];
  previousState = [];

  for (
    let i = 0;
    i < count;
    i++
  ) {

    staff.push({

      name:
        oldStaff[i]?.name ||
        String.fromCharCode(65 + i),

      level:
        oldStaff[i]?.level || 2,

      publicHoliday:
        currentPublicHoliday,

      paidLeave:
        oldStaff[i]?.paidLeave ?? 0

    });

    previousState.push({

      shift:
        oldPrevious[i]?.shift || "休",

      consecutive:
        oldPrevious[i]?.consecutive ?? 0

    });

  }

}


/* =========================================================
   希望入力初期化
========================================================= */

function createRequests() {

  const old =
    requests;

  requests = [];

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    requests[s] = [];

    for (
      let d = 0;
      d < days;
      d++
    ) {

      requests[s][d] =
        old[s]?.[d] || "";

    }

  }

}


/* =========================================================
   全UI
========================================================= */

function renderAll() {

  renderPrevious();

  renderStaff();

  renderRequests();

}


/* =========================================================
   前月末
========================================================= */

function renderPrevious() {

  const container =
    document.getElementById(
      "previousContainer"
    );

  container.innerHTML = "";

  staff.forEach((person, i) => {

    const div =
      document.createElement("div");

    div.className =
      "staff-card";

    div.innerHTML = `

      <div class="staff-title">
        ${escapeHtml(person.name)}
      </div>

      <div class="row">

        <div class="field">

          <label>
            前月最終日
          </label>

          <select
            data-prev-staff="${i}"
            data-prev-field="shift"
          >

            <option value="HA"
              ${previousState[i].shift === "HA" ? "selected" : ""}>
              HA
            </option>

            <option value="HP"
              ${previousState[i].shift === "HP" ? "selected" : ""}>
              HP
            </option>

            <option value="休"
              ${previousState[i].shift === "休" ? "selected" : ""}>
              休
            </option>

            <option value="有休"
              ${previousState[i].shift === "有休" ? "selected" : ""}>
              有休
            </option>

          </select>

        </div>

        <div class="field">

          <label>
            前月末の連勤
          </label>

          <select
            data-prev-staff="${i}"
            data-prev-field="consecutive"
          >

            ${createConsecutiveOptions(
              previousState[i].consecutive
            )}

          </select>

        </div>

      </div>

    `;

    container.appendChild(div);

  });

}


function createConsecutiveOptions(selected) {

  const max =
    Number(maxConsecutiveSelect.value);

  let html = "";

  for (
    let i = 0;
    i <= max;
    i++
  ) {

    html += `
      <option
        value="${i}"
        ${Number(selected) === i ? "selected" : ""}
      >
        ${i === 0 ? "0（休み）" : i + "連勤目"}
      </option>
    `;

  }

  return html;

}


/* =========================================================
   スタッフ表示
========================================================= */

function renderStaff() {

  const container =
    document.getElementById(
      "staffContainer"
    );

  container.innerHTML = "";

  const autoPublicHoliday =
    calculatePublicHolidayCount()
      .publicHolidayCount;

  staff.forEach((person, i) => {

    /*
      公休数は自動値に同期
    */

    person.publicHoliday =
      autoPublicHoliday;

    const div =
      document.createElement("div");

    div.className =
      "staff-card";

    div.innerHTML = `

      <div class="staff-title">
        スタッフ${i + 1}
      </div>

      <div class="row">

        <div class="field">

          <label>名前</label>

          <input
            type="text"
            value="${escapeHtml(person.name)}"
            data-staff="${i}"
            data-field="name"
          >

        </div>

        <div class="field">

          <label>レベル</label>

          <select
            data-staff="${i}"
            data-field="level"
          >

            <option value="1"
              ${person.level === 1 ? "selected" : ""}>
              1：研修中
            </option>

            <option value="2"
              ${person.level === 2 ? "selected" : ""}>
              2：独り立ち
            </option>

          </select>

        </div>

        <div class="field">

          <label>
            公休
            <span class="auto-badge">
              自動
            </span>
          </label>

          <input
            type="number"
            min="0"
            max="${days}"
            value="${autoPublicHoliday}"
            readonly
          >

        </div>

        <div class="field">

          <label>有休</label>

          <input
            type="number"
            min="0"
            max="${days}"
            value="${person.paidLeave}"
            data-staff="${i}"
            data-field="paidLeave"
          >

        </div>

      </div>

      <div class="small" style="margin-top:8px;">
        公休は土日＋祝日から自動計算されます。
      </div>

    `;

    container.appendChild(div);

  });

}


/* =========================================================
   希望表
========================================================= */

function renderRequests() {

  const head =
    document.getElementById(
      "requestHead"
    );

  const body =
    document.getElementById(
      "requestBody"
    );

  head.innerHTML = "";
  body.innerHTML = "";

  let header =
    "<tr><th>名前</th>";

  for (
    let d = 0;
    d < days;
    d++
  ) {

    header += `
      <th class="date-head">
        ${d + 1}日
      </th>
    `;

  }

  header += "</tr>";

  head.innerHTML =
    header;


  staff.forEach((person, s) => {

    let row =
      `<tr>
        <td>
          ${escapeHtml(person.name)}
        </td>`;

    for (
      let d = 0;
      d < days;
      d++
    ) {

      const value =
        requests[s][d];

      const cls =
        requestClass(value);

      row += `

        <td class="${cls}">

          <select
            class="request-select"
            data-s="${s}"
            data-d="${d}"
          >

            <option value=""
              ${value === "" ? "selected" : ""}>
              -
            </option>

            <option value="HA"
              ${value === "HA" ? "selected" : ""}>
              HA希望
            </option>

            <option value="HP"
              ${value === "HP" ? "selected" : ""}>
              HP希望
            </option>

            <option value="休"
              ${value === "休" ? "selected" : ""}>
              休
            </option>

            <option value="有休"
              ${value === "有休" ? "selected" : ""}>
              有休
            </option>

          </select>

        </td>

      `;

    }

    row += "</tr>";

    body.innerHTML += row;

  });

}


function requestClass(value) {

  if (value === "HA")
    return "request-ha";

  if (value === "HP")
    return "request-hp";

  if (value === "休")
    return "request-rest";

  if (value === "有休")
    return "request-paid";

  return "request-none";

}


/* =========================================================
   入力イベント
========================================================= */

document.addEventListener(
  "change",
  event => {

    const target =
      event.target;


    /* スタッフ */

    if (
      target.dataset.staff !== undefined
    ) {

      const i =
        Number(target.dataset.staff);

      const field =
        target.dataset.field;


      if (field === "name") {

        staff[i].name =
          target.value ||
          String.fromCharCode(
            65 + i
          );

        renderRequests();
        renderPrevious();

      }


      if (field === "level") {

        staff[i].level =
          Number(target.value);

      }


      if (field === "paidLeave") {

        staff[i].paidLeave =
          Math.max(
            0,
            Math.min(
              days,
              Number(target.value) || 0
            )
          );

        target.value =
          staff[i].paidLeave;

      }

    }


    /* 前月末 */

    if (
      target.dataset.prevStaff !== undefined
    ) {

      const i =
        Number(target.dataset.prevStaff);

      const field =
        target.dataset.prevField;


      if (field === "shift") {

        previousState[i].shift =
          target.value;

        if (
          target.value === "休" ||
          target.value === "有休"
        ) {

          previousState[i].consecutive = 0;

        }

      }


      if (
        field === "consecutive"
      ) {

        previousState[i].consecutive =
          Number(target.value);

      }

    }


    /* 希望 */

    if (
      target.classList.contains(
        "request-select"
      )
    ) {

      const s =
        Number(target.dataset.s);

      const d =
        Number(target.dataset.d);

      requests[s][d] =
        target.value;

      target.closest("td").className =
        requestClass(
          target.value
        );

    }

  }
);

/* =========================================================
   ユーティリティ
========================================================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function shuffle(array) {

  const result =
    [...array];

  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];

  }

  return result;

}

function validateRequests() {

  for (
    let s = 0;

    s++
  ) {

    let rest = 0;

    for (

      d++

/* =========================================================
   固定休
========================================================= */

function isFixedOff(s, d) {

  return (
    requests[s][d] === "休" ||
    requests[s][d] === "有休"
  );

}


/* =========================================================
   シフト候補
========================================================= */

function makeDailyCandidates(
  day,
  previousShifts
) {

  const haNeed =
    Number(
      document.getElementById(
        "haNeed"
      ).value
    );

  const hpNeed =
    Number(
      document.getElementById(
        "hpNeed"
      ).value
    );

  const all =
    staff.map(
      (_, i) => i
    );

  const available =
    all.filter(
      s => !isFixedOff(s, day)
    );

  if (
    available.length <
    haNeed + hpNeed
  ) {

    return [];

  }

  const candidates = [];

  const haSets =
    combinations(
      available,
      haNeed
    );

  for (
    const ha of haSets
  ) {

    const remaining =
      available.filter(
        s => !ha.includes(s)
      );

    const hpSets =
      combinations(
        remaining,
        hpNeed
      );

    for (
      const hp of hpSets
    ) {

      let invalid = false;

      /*
        HP→翌日HA禁止
      */

      for (
        const s of ha
      ) {

        if (
          previousShifts[s] === "HP"
        ) {

          invalid = true;
          break;

        }

      }

      if (invalid)
        continue;


      /*
        レベル1にはレベル2が必要
      */

      const working =
        [...ha, ...hp];

      const hasLevel1 =
        working.some(
          s => staff[s].level === 1
        );

      const hasLevel2 =
        working.some(
          s => staff[s].level === 2
        );

      if (
        hasLevel1 &&
        !hasLevel2
      ) {

        continue;

      }


      let score = 0;


      for (
        const s of ha
      ) {

        if (
          requests[s][day] === "HA"
        ) {

          score += 100;

        }

        if (
          previousShifts[s] === "HA"
        ) {

          score += 15;

        }

      }


      for (
        const s of hp
      ) {

        if (
          requests[s][day] === "HP"
        ) {

          score += 100;

        }

        if (
          previousShifts[s] === "HP"
        ) {

          score += 15;

        }

      }


      for (
        const s of working
      ) {

        const request =
          requests[s][day];

        if (
          request === "HA" &&
          !ha.includes(s)
        ) {

          score -= 40;

        }

        if (
          request === "HP" &&
          !hp.includes(s)
        ) {

          score -= 40;

        }

      }


      candidates.push({
        ha,
        hp,
        score
      });

    }

  }

  return candidates.sort(
    (a, b) =>
      b.score - a.score
  );

}


/* =========================================================
   組み合わせ
========================================================= */

function combinations(
  array,
  count
) {

  if (count === 0)
    return [[]];

  if (array.length < count)
    return [];

  const result = [];

  function dfs(
    start,
    chosen
  ) {

    if (
      chosen.length === count
    ) {

      result.push(
        [...chosen]
      );

      return;

    }

    for (
      let i = start;
      i < array.length;
      i++
    ) {

      chosen.push(
        array[i]
      );

      dfs(
        i + 1,
        chosen
      );

      chosen.pop();

    }

  }

  dfs(0, []);

  return result;

}


/* =========================================================
   連勤
========================================================= */

function canWork(
  currentRun,
  maxConsecutive
) {

  return (
    currentRun <
    maxConsecutive
  );

}

    ) {

          ],

    ) {

      ) {

          details: [
            `前月末連勤数：${state.consecutive}連勤`,
            `最大連勤：${max}連勤`
          ],
          advice:
            "前月末連勤数か最大連勤を見直してください。"
        };

      }

    }

  }


  return {
    error: false
  };

}


/* =========================================================
   シフト作成
========================================================= */

function generateSchedule() {

  const haNeed =
    Number(
      document.getElementById(
        "haNeed"
      ).value
    );

  const hpNeed =
    Number(
      document.getElementById(
        "hpNeed"
      ).value
    );

  const required =
    haNeed + hpNeed;


  if (
    staff.length < required
  ) {

    return {
      error:
        `スタッフが${staff.length}人しかいません。` +
        `HA${haNeed}人＋HP${hpNeed}人なので、` +
        `最低${required}人必要です。`
    };

  }


  const maxConsecutive =
    Number(
      maxConsecutiveSelect.value
    );


  /*
    公休は「基準値」として保持する。

    実際の休みは、
    必要人数から自動的に決まる。
  */

  const publicHoliday =
    Number(
      calculatePublicHolidayCount()
        .publicHolidayCount
    );


  /*
    有休のみは絶対数として扱う。
  */

  const paidTargets =
    staff.map(
      p =>
        Number(p.paidLeave) || 0
    );


  /*
    固定有休チェック
  */

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    let paid = 0;

    for (
      let d = 0;
      d < days;
      d++
    ) {

      if (
        requests[s][d] === "有休"
      ) {

        paid++;

      }

    }

    if (
      paid >
      paidTargets[s]
    ) {

      return {
        error:
          `${staff[s].name}さんの有休希望が` +
          `設定数を超えています。`
      };

    }

  }


  let best = null;
  let bestScore = -Infinity;


  /*
    試行回数
  */

  const attempts = 350;


  for (
    let attempt = 0;
    attempt < attempts;
    attempt++
  ) {

    const result =
      Array.from(
        {length: staff.length},
        () =>
          new Array(days)
            .fill(null)
      );


    const paidCount =
      new Array(
        staff.length
      ).fill(0);


    const run =
      previousState.map(
        state =>
          Number(state.consecutive) || 0
      );


    const previousShift =
      previousState.map(
        state =>
          state.shift || "休"
      );


    /*
      固定有休・休
    */

    for (
      let s = 0;
      s < staff.length;
      s++
    ) {

      for (
        let d = 0;
        d < days;
        d++
      ) {

        if (
          requests[s][d] === "有休"
        ) {

          result[s][d] =
            "有休";

          paidCount[s]++;

        }

        else if (
          requests[s][d] === "休"
        ) {

          result[s][d] =
            "休";

        }

      }

    }


    let failed = false;


    /*
      日ごと
    */

    for (
      let d = 0;
      d < days;
      d++
    ) {

      const candidates =
        makeDailyCandidates(
          d,
          previousShift
        );


      const shuffled =
        shuffle(
          candidates.slice(0, 80)
        );


      if (
        shuffled.length === 0
      ) {

        failed = true;
        break;

      }


      let chosen = null;


      for (
        const candidate
        of shuffled
      ) {

        let valid = true;


        const working =
          new Set([
            ...candidate.ha,
            ...candidate.hp
          ]);


        /*
          連勤
        */

        for (
          let s = 0;
          s < staff.length;
          s++
        ) {

          if (
            working.has(s)
          ) {

            if (
              !canWork(
                run[s],
                maxConsecutive
              )
            ) {

              valid = false;
              break;

            }

          }

        }


        if (!valid)
          continue;


        /*
          有休後の状態など
        */

        for (
          let s = 0;
          s < staff.length;
          s++
        ) {

          if (
            working.has(s)
          ) {

            if (
              result[s][d] === "有休" ||
              result[s][d] === "休"
            ) {

              valid = false;
              break;

            }

          }

        }


        if (!valid)
          continue;


        /*
          残り日数で
          有休希望を消化できるか
        */

        for (
          let s = 0;
          s < staff.length;
          s++
        ) {

          if (
            paidCount[s] >
            paidTargets[s]
          ) {

            valid = false;
            break;

          }

        }


        if (!valid)
          continue;


        chosen =
          candidate;

        break;

      }


      if (!chosen) {

        failed = true;
        break;

      }


      const working =
        new Set([
          ...chosen.ha,
          ...chosen.hp
        ]);


      for (
        let s = 0;
        s < staff.length;
        s++
      ) {

        if (
          working.has(s)
        ) {

          if (
            chosen.ha.includes(s)
          ) {

            result[s][d] =
              "HA";

          } else {

            result[s][d] =
              "HP";

          }

          run[s]++;

          previousShift[s] =
            result[s][d];

        }

        else {

          /*
            希望休・有休はそのまま
          */

          if (
            result[s][d] !== "有休" &&
            result[s][d] !== "休"
          ) {

            result[s][d] =
              "休";

          }

          run[s] = 0;

          previousShift[s] =
            result[s][d];

        }

      }

    }


    if (failed)
      continue;


    /*
      休みの日数は、
      「必要人数から決まった日数」
      になっているのでここでは
      公休数との完全一致を要求しない。
    */


    /*
      最終的に有休数を確認
    */

    for (
      let s = 0;
      s < staff.length;
      s++
    ) {

      if (
        paidCount[s] !==
        paidTargets[s]
      ) {

        /*
          有休は設定数を必ず
          全消化する仕様ではない。
          希望された有休だけ守る。
        */

      }

    }


    /*
      スコア
    */

    let score = 0;


    for (
      let s = 0;
      s < staff.length;
      s++
    ) {

      for (
        let d = 0;
        d < days;
        d++
      ) {

        const current =
          result[s][d];


        /*
          希望一致
        */

        if (
          requests[s][d] ===
          current
        ) {

          score += 100;

        }


        /*
          HA連続
        */

        if (
          current === "HA" &&
          d > 0 &&
          result[s][d - 1] === "HA"
        ) {

          score += 12;

        }


        /*
          HP連続
        */

        if (
          current === "HP" &&
          d > 0 &&
          result[s][d - 1] === "HP"
        ) {

          score += 12;

        }

      }

    }


    /*
      単発勤務を減点
    */

    for (
      let s = 0;
      s < staff.length;
      s++
    ) {

      for (
        let d = 0;
        d < days;
        d++
      ) {

        if (
          result[s][d] !== "HA" &&
          result[s][d] !== "HP"
        ) {

          continue;

        }


        const before =
          d === 0
            ? (
                previousState[s].consecutive > 0
              )
            : (
                result[s][d - 1] === "HA" ||
                result[s][d - 1] === "HP"
              );


        const after =
          d === days - 1
            ? false
            : (
                result[s][d + 1] === "HA" ||
                result[s][d + 1] === "HP"
              );


        if (
          !before &&
          !after
        ) {

          score -= 100;

        }

      }

    }


    if (
      score > bestScore
    ) {

      bestScore = score;

      best =
        result;

    }

  }


  if (!best) {

    return {
      error:
        "設定された条件をすべて満たすシフトを作成できませんでした。"
    };

  }


  return {
    schedule: best
  };

}


/* =========================================================
   最終検証
========================================================= */

function validateSchedule(result) {

  const haNeed =
    Number(
      document.getElementById(
        "haNeed"
      ).value
    );

  const hpNeed =
    Number(
      document.getElementById(
        "hpNeed"
      ).value
    );

  const max =
    Number(
      maxConsecutiveSelect.value
    );


  /*
    日別人数
  */

  for (
    let d = 0;
    d < days;
    d++
  ) {

    let ha = 0;
    let hp = 0;

    const working = [];


    for (
      let s = 0;
      s < staff.length;
      s++
    ) {

      if (
        result[s][d] === "HA"
      ) {

        ha++;
        working.push(s);

      }


      if (
        result[s][d] === "HP"
      ) {

        hp++;
        working.push(s);

      }

    }


    if (
      ha !== haNeed
    ) {

      return `${d + 1}日のHA人数が${haNeed}人ではありません。`;

    }


    if (
      hp !== hpNeed
    ) {

      return `${d + 1}日のHP人数が${hpNeed}人ではありません。`;

    }


    /*
      レベル
    */

    const hasLevel1 =
      working.some(
        s => staff[s].level === 1
      );

    const hasLevel2 =
      working.some(
        s => staff[s].level === 2
      );


    if (
      hasLevel1 &&
      !hasLevel2
    ) {

      return `${d + 1}日にレベル2スタッフが必要です。`;

    }

  }


  /*
    連勤
  */

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    let run =
      Number(
        previousState[s].consecutive
      ) || 0;


    for (
      let d = 0;
      d < days;
      d++
    ) {

      const working =
        result[s][d] === "HA" ||
        result[s][d] === "HP";


      if (working) {

        run++;


        if (
          run > max
        ) {

          return `${staff[s].name}さんが${max}連勤を超えています。`;

        }

      } else {

        run = 0;

      }

    }

  }


  /*
    HP→翌日HA
  */

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    if (
      previousState[s].shift === "HP" &&
      result[s][0] === "HA"
    ) {

      return `${staff[s].name}さんが前月末HP→今月1日HAになっています。`;

    }


    for (
      let d = 0;
      d < days - 1;
      d++
    ) {

      if (
        result[s][d] === "HP" &&
        result[s][d + 1] === "HA"
      ) {

        return `${staff[s].name}さんがHPの翌日にHAになっています。`;

      }

    }

  }


  /*
    希望休
  */

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    for (
      let d = 0;
      d < days;
      d++
    ) {

      if (
        requests[s][d] === "休" &&
        result[s][d] !== "休"
      ) {

        return `${staff[s].name}さんの${d + 1}日休希望が反映されていません。`;

      }


      if (
        requests[s][d] === "有休" &&
        result[s][d] !== "有休"
      ) {

        return `${staff[s].name}さんの${d + 1}日有休希望が反映されていません。`;

      }

    }

  }


  return "";

}


/* =========================================================
   結果表示
========================================================= */

function renderResult() {

  const card =
    document.getElementById(
      "resultCard"
    );

  const head =
    document.getElementById(
      "resultHead"
    );

  const body =
    document.getElementById(
      "resultBody"
    );


  card.classList.remove(
    "hidden"
  );


  let header =
    "<tr><th>名前</th>";


  for (
    let d = 0;
    d < days;
    d++
  ) {

    header += `
      <th>
        ${d + 1}日
      </th>
    `;

  }


  header += "</tr>";

  head.innerHTML =
    header;

  body.innerHTML = "";


  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    let row =
      `<tr>
        <td>
          ${escapeHtml(
            staff[s].name
          )}
        </td>`;


    for (
      let d = 0;
      d < days;
      d++
    ) {

      const value =
        schedule[s][d];


      let cls =
        "shift-rest";


      if (
        value === "HA"
      ) {

        cls =
          "shift-ha";

      }


      if (
        value === "HP"
      ) {

        cls =
          "shift-hp";

      }


      if (
        value === "有休"
      ) {

        cls =
          "shift-paid";

      }


      let mark = "";


      if (
        requests[s][d] === "HA"
      ) {

        mark =
          `<span class="request-mark">
            HA希望
          </span>`;

      }


      if (
        requests[s][d] === "HP"
      ) {

        mark =
          `<span class="request-mark">
            HP希望
          </span>`;

      }


      if (
        requests[s][d] === "休"
      ) {

        mark =
          `<span class="request-mark">
            休希望
          </span>`;

      }


      if (
        requests[s][d] === "有休"
      ) {

        mark =
          `<span class="request-mark">
            有休
          </span>`;

      }


      row += `
        <td class="${cls}">
          ${value}
          ${mark}
        </td>
      `;

    }


    row += "</tr>";

    body.innerHTML += row;

  }

}


/* =========================================================
   作成ボタン
========================================================= */

document.getElementById(
  "generateBtn"
).addEventListener(
  "click",
  () => {

    const message =
      document.getElementById(
        "message"
      );


    message.innerHTML = `
      <div class="success">
        シフトを作成しています……<br>
        条件を確認しながら自動作成しています。
      </div>
    `;


    setTimeout(() => {

      try {

        /*
          希望チェック
        */

        const requestError =
          validateRequests();


        if (
          requestError
        ) {

          message.innerHTML = `
            <div class="error">
              <strong>
                シフトを作成できません
              </strong>
              <br><br>
              ${escapeHtml(
                requestError
              )}
            </div>
          `;

          return;

        }


        /*
          条件診断
        */

        const diagnosis =
          diagnoseConditions();


        if (
          diagnosis.error
        ) {

          message.innerHTML = `

            <div class="error">

              <strong>
                シフトを作成できません
              </strong>

              <br><br>

              <strong>
                ${escapeHtml(
                  diagnosis.title
                )}
              </strong>

              <br><br>

              ${diagnosis.details
                .map(
                  detail =>
                    escapeHtml(detail)
                )
                .join("<br>")
              }

              <br><br>

              <strong>
                対処方法
              </strong>

              <br>

              ${escapeHtml(
                diagnosis.advice
              )}

            </div>

          `;

          return;

        }


        /*
          作成
        */

        const result =
          generateSchedule();


        if (
          result.error
        ) {

          message.innerHTML = `

            <div class="error">

              <strong>
                シフトを作成できませんでした
              </strong>

              <br><br>

              ${escapeHtml(
                result.error
              )}

              <br><br>

              基本的な人数条件は満たしていますが、
              <strong>
                連勤・HP→翌日HA・希望・レベル条件
              </strong>
              などの組み合わせによって
              成立しない可能性があります。

            </div>

          `;

          return;

        }


        schedule =
          result.schedule;


        /*
          最終検証
        */

        const finalError =
          validateSchedule(
            schedule
          );


        if (
          finalError
        ) {

          message.innerHTML = `
            <div class="error">
              ${escapeHtml(
                finalError
              )}
            </div>
          `;

          return;

        }


        /*
          成功
        */

        renderResult();


        message.innerHTML = `

          <div class="success">

            <strong>
              シフトを作成しました！
            </strong>

            <br>

            公休基準：
            ${calculatePublicHolidayCount()
              .publicHolidayCount}日

            <br>

            土日：
            ${calculatePublicHolidayCount()
              .weekendCount}日

            ／

            祝日：
            ${calculatePublicHolidayCount()
              .holidayCount}日

          </div>

        `;


        document.getElementById(
          "resultCard"
        ).scrollIntoView({
          behavior: "smooth"
        });


      } catch (error) {

        console.error(error);


        message.innerHTML = `

          <div class="error">

            シフト作成中にエラーが発生しました。<br>

            ページを再読み込みして、
            もう一度試してください。

          </div>

        `;

      }

    }, 50);

  }
);


/* =========================================================
   リセット
========================================================= */

document.getElementById(
  "resetBtn"
).addEventListener(
  "click",
  () => {

    requests = [];

    for (
      let s = 0;
      s < staff.length;
      s++
    ) {

      requests[s] =
        new Array(days)
          .fill("");

    }


    renderRequests();


    document.getElementById(
      "message"
    ).innerHTML = "";


    document.getElementById(
      "resultCard"
    ).classList.add(
      "hidden"
    );

  }
);


/* =========================================================
   初期化
========================================================= */

(async function init() {

  days =
    getDaysInSelectedMonth();


  document.getElementById(
    "daysLabel"
  ).textContent =
    days;


  /*
    まず祝日を取得
  */

  await fetchJapaneseHolidays();


  createStaff();

  createRequests();

  updatePublicHolidayDisplay();

  renderAll();

})();

</script>
