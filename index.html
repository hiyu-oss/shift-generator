<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シフト作成</title>

<style>
*{box-sizing:border-box}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
    background:#f5f5f7;
    margin:0;
    padding:15px;
    color:#222;
}

.container{
    max-width:1100px;
    margin:auto;
}

h1{
    text-align:center;
    margin:10px 0 20px;
}

.card{
    background:white;
    padding:18px;
    border-radius:16px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

h2{
    font-size:20px;
    margin-top:0;
}

label{
    display:block;
    font-weight:bold;
    margin-top:12px;
}

input,select{
    width:100%;
    padding:11px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:9px;
    background:white;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    margin-top:12px;
    font-size:16px;
    font-weight:bold;
}

.primary{
    background:#007aff;
    color:white;
}

.secondary{
    background:#e9e9ee;
    color:#222;
}

.staff{
    border:1px solid #ddd;
    border-radius:12px;
    padding:12px;
    margin-bottom:10px;
}

.staff-grid{
    display:grid;
    grid-template-columns:1.5fr 1fr 1fr 1fr;
    gap:8px;
}

.small-label{
    font-size:12px;
    margin:0;
}

.help{
    color:#666;
    font-size:13px;
    line-height:1.5;
}

.scroll{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
}

table{
    border-collapse:collapse;
    width:100%;
    min-width:700px;
}

th,td{
    border:1px solid #ccc;
    padding:6px;
    text-align:center;
    white-space:nowrap;
}

th{
    background:#f0f0f3;
}

.shift-HA{
    background:#fff4cc;
    font-weight:bold;
}

.shift-HP{
    background:#dceeff;
    font-weight:bold;
}

.shift-off{
    background:#eee;
}

.shift-paid{
    background:#e5d8ff;
    font-weight:bold;
}

.success{
    background:#edfff2;
    color:#167333;
    padding:14px;
    border-radius:10px;
    margin-bottom:12px;
}

.error{
    background:#fff0f0;
    color:#b00000;
    padding:14px;
    border-radius:10px;
    line-height:1.6;
}

.legend{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin:10px 0;
}

.legend span{
    padding:5px 9px;
    border-radius:6px;
    font-size:13px;
}

.lha{background:#fff4cc}
.lhp{background:#dceeff}
.loff{background:#eee}
.lpaid{background:#e5d8ff}

@media(max-width:600px){
    .staff-grid{
        grid-template-columns:1fr 1fr;
    }

    .staff-grid>div:first-child{
        grid-column:span 2;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>📅 シフト作成</h1>

<div class="card">

<h2>① 基本設定</h2>

<label>年月</label>
<input id="yearMonth" type="month">

<label>スタッフ人数</label>
<select id="staffCount" onchange="buildStaffSettings()">
<option value="1">1人</option>
<option value="2">2人</option>
<option value="3">3人</option>
<option value="4">4人</option>
<option value="5">5人</option>
<option value="6">6人</option>
<option value="7">7人</option>
<option value="8">8人</option>
<option value="9">9人</option>
<option value="10" selected>10人</option>
</select>

<label>最大連勤</label>
<select id="maxConsecutive">
<option value="3" selected>3連勤</option>
</select>

<p class="help">
通常は最大3連勤です。<br>
希望休を優先するために必要な場合のみ4連勤を許可します。
</p>

</div>

<div class="card">

<h2>② 1日の必要人数</h2>

<div class="staff-grid">

<div>
<label class="small-label">HA</label>
<input id="needHA" type="number" min="0" value="3">
</div>

<div>
<label class="small-label">HP</label>
<input id="needHP" type="number" min="0" value="2">
</div>

</div>

<p class="help">
HA：6:00〜15:00<br>
HP：13:30〜22:30
</p>

</div>

<div class="card">

<h2>③ スタッフ設定</h2>

<p class="help">
レベル1＝研修中<br>
レベル2＝独り立ち
</p>

<div id="staffSettings"></div>

</div>

<div class="card">

<h2>④ 希望休・希望勤務</h2>

<p class="help">
「休」「有休」は固定します。<br>
HA希望・HP希望はできるだけ優先します。
</p>

<div id="requestArea"></div>

</div>

<div class="card">

<button class="primary" onclick="generateSchedule()">
シフトを作成する
</button>

<button class="secondary" onclick="clearRequests()">
希望設定をリセット
</button>

</div>

<div class="card">

<h2>⑤ シフト結果</h2>

<div id="result">
ここにシフトが表示されます。
</div>

</div>

</div>

<script>

/* =========================================
   初期化
========================================= */

const defaultNames=[
"A","B","C","D","E",
"F","G","H","I","J"
];

function setDefaultMonth(){

    const now=new Date();

    document.getElementById("yearMonth").value=
        now.getFullYear()+"-"+
        String(now.getMonth()+1).padStart(2,"0");
}


/* =========================================
   月の日数
========================================= */

function getDays(){

    const v=document.getElementById("yearMonth").value;

    if(!v)return 30;

    const [y,m]=v.split("-").map(Number);

    return new Date(y,m,0).getDate();
}


/* =========================================
   数値選択肢
========================================= */

function numberOptions(max,selected){

    let h="";

    for(let i=0;i<=max;i++){

        h+=`
        <option value="${i}" ${i===selected?"selected":""}>
        ${i}
        </option>`;
    }

    return h;
}


/* =========================================
   スタッフ設定
========================================= */

function buildStaffSettings(){

    const count=
        Number(document.getElementById("staffCount").value);

    let html="";

    for(let i=0;i<count;i++){

        html+=`
        <div class="staff">

        <strong>スタッフ${i+1}</strong>

        <div class="staff-grid">

        <div>
        <label class="small-label">名前</label>
        <input
            id="name_${i}"
            value="${defaultNames[i]}"
            maxlength="20"
            onchange="buildRequestArea()">
        </div>

        <div>
        <label class="small-label">レベル</label>
        <select id="level_${i}">
            <option value="1">1（研修中）</option>
            <option value="2" selected>2（独り立ち）</option>
        </select>
        </div>

        <div>
        <label class="small-label">公休</label>
        <select id="off_${i}">
            ${numberOptions(31,11)}
        </select>
        </div>

        <div>
        <label class="small-label">有休</label>
        <select id="paid_${i}">
            ${numberOptions(31,0)}
        </select>
        </div>

        </div>
        </div>
        `;
    }

    document.getElementById("staffSettings").innerHTML=html;

    buildRequestArea();
}


/* =========================================
   希望入力
========================================= */

function buildRequestArea(){

    const count=
        Number(document.getElementById("staffCount").value);

    const days=getDays();

    let html=`
    <div class="scroll">
    <table>
    <tr>
    <th>名前</th>
    `;

    for(let d=1;d<=days;d++){
        html+=`<th>${d}</th>`;
    }

    html+="</tr>";

    for(let i=0;i<count;i++){

        const nameEl=
            document.getElementById(`name_${i}`);

        const name=
            nameEl ? nameEl.value : defaultNames[i];

        html+=`
        <tr>
        <th>${escapeHtml(name)}</th>
        `;

        for(let d=1;d<=days;d++){

            html+=`
            <td>
            <select id="req_${i}_${d}">
                <option value="">指定なし</option>
                <option value="HA">HA希望</option>
                <option value="HP">HP希望</option>
                <option value="休">休</option>
                <option value="有休">有休</option>
            </select>
            </td>`;
        }

        html+="</tr>";
    }

    html+=`
    </table>
    </div>`;

    document.getElementById("requestArea").innerHTML=html;
}


/* =========================================
   情報取得
========================================= */

function getStaff(){

    const count=
        Number(document.getElementById("staffCount").value);

    const result=[];

    for(let i=0;i<count;i++){

        result.push({
            name:
                document.getElementById(`name_${i}`).value
                ||defaultNames[i],

            level:
                Number(document.getElementById(`level_${i}`).value),

            off:
                Number(document.getElementById(`off_${i}`).value),

            paid:
                Number(document.getElementById(`paid_${i}`).value)
        });
    }

    return result;
}


function getRequests(staff,days){

    return staff.map((s,i)=>{

        const arr=[];

        for(let d=1;d<=days;d++){

            const el=
                document.getElementById(`req_${i}_${d}`);

            arr.push(el?el.value:"");
        }

        return arr;
    });
}


/* =========================================
   勤務パターン生成
   ここが今回の重要な修正版
========================================= */

function createWorkPattern(
    days,
    offCount,
    requests,
    allowFour
){

    const fixedOff=
        requests.filter(
            x=>x==="休"||x==="有休"
        ).length;

    if(fixedOff>offCount){
        return null;
    }

    const remainingOff=
        offCount-fixedOff;


    /*
       DPで「条件を満たす休み・勤務パターン」が
       存在するか確認しながら作る
    */

    const memo=new Map();

    function key(day,offUsed,run,lastWork){

        return [
            day,
            offUsed,
            run,
            lastWork?1:0
        ].join(",");
    }


    function possible(day,offUsed,run,lastWork){

        if(day===days){

            return offUsed===offCount;
        }

        const k=key(
            day,
            offUsed,
            run,
            lastWork
        );

        if(memo.has(k)){
            return memo.get(k);
        }


        const req=requests[day];

        /*
           固定休
        */

        if(req==="休"||req==="有休"){

            const ok=
                possible(
                    day+1,
                    offUsed+1,
                    0,
                    false
                );

            memo.set(k,ok);

            return ok;
        }


        /*
           休みにする
        */

        if(offUsed<offCount){

            if(
                possible(
                    day+1,
                    offUsed+1,
                    0,
                    false
                )
            ){

                memo.set(k,true);
                return true;
            }
        }


        /*
           勤務
        */

        const maxRun=
            allowFour ? 4 : 3;

        if(run<maxRun){

            /*
               1連勤だけになる可能性を避ける。
               次の日が休みになるなら、
               今まで勤務していなければ禁止。
            */

            if(lastWork){

                if(
                    possible(
                        day+1,
                        offUsed,
                        run+1,
                        true
                    )
                ){

                    memo.set(k,true);
                    return true;
                }

            }else{

                /*
                   初日の勤務、または休み明け勤務。
                   次の日も勤務できることを確認。
                */

                if(day+1<days){

                    const nextReq=requests[day+1];

                    const nextIsFixedOff=
                        nextReq==="休"||
                        nextReq==="有休";

                    if(!nextIsFixedOff){

                        if(
                            possible(
                                day+1,
                                offUsed,
                                1,
                                true
                            )
                        ){

                            memo.set(k,true);
                            return true;
                        }
                    }
                }
            }
        }

        memo.set(k,false);

        return false;
    }


    if(!possible(0,0,0,false)){
        return null;
    }


    /*
       実際のパターンを作る
    */

    const pattern=[];

    let day=0;
    let offUsed=0;
    let run=0;
    let lastWork=false;

    while(day<days){

        const req=requests[day];

        /*
           固定休
        */

        if(req==="休"||req==="有休"){

            pattern.push("OFF");

            offUsed++;
            run=0;
            lastWork=false;
            day++;

            continue;
        }


        const choices=[];


        /*
           休み候補
        */

        if(offUsed<offCount){

            if(
                possible(
                    day+1,
                    offUsed+1,
                    0,
                    false
                )
            ){

                choices.push("OFF");
            }
        }


        /*
           勤務候補
        */

        const maxRun=allowFour?4:3;

        if(run<maxRun){

            if(lastWork){

                if(
                    possible(
                        day+1,
                        offUsed,
                        run+1,
                        true
                    )
                ){

                    choices.push("WORK");
                }

            }else if(day+1<days){

                const nextReq=requests[day+1];

                if(
                    nextReq!=="休" &&
                    nextReq!=="有休" &&
                    possible(
                        day+1,
                        offUsed,
                        1,
                        true
                    )
                ){

                    choices.push("WORK");
                }
            }
        }


        if(choices.length===0){
            return null;
        }


        /*
           ランダムではなく、
           なるべく勤務ブロックを2〜3日にする
        */

        let choice;

        if(choices.includes("WORK") && run===0){

            choice="WORK";

        }else{

            choice=
                choices[
                    Math.floor(
                        Math.random()*choices.length
                    )
                ];
        }


        if(choice==="OFF"){

            pattern.push("OFF");

            offUsed++;
            run=0;
            lastWork=false;

        }else{

            pattern.push("WORK");

            run++;
            lastWork=true;
        }

        day++;
    }

    return pattern;
}


/* =========================================
   全員の勤務パターンを作る
========================================= */

function generateWorkPatterns(
    staff,
    requests,
    days
){

    const patterns=[];

    for(let i=0;i<staff.length;i++){

        let pattern=null;

        /*
           まず3連勤以内で探す
        */

        for(let t=0;t<50;t++){

            pattern=
                createWorkPattern(
                    days,
                    staff[i].off,
                    requests[i],
                    false
                );

            if(pattern)break;
        }


        /*
           希望休などで3連勤では無理なら
           4連勤を許可
        */

        if(!pattern){

            for(let t=0;t<100;t++){

                pattern=
                    createWorkPattern(
                        days,
                        staff[i].off,
                        requests[i],
                        true
                    );

                if(pattern)break;
            }
        }


        if(!pattern){
            return null;
        }

        patterns.push(pattern);
    }

    return patterns;
}


/* =========================================
   勤務パターン評価
========================================= */

function evaluateWorkPatterns(
    patterns,
    staff,
    days,
    needTotal
){

    let score=0;


    for(let d=0;d<days;d++){

        let workers=0;
        let level2=0;

        for(let i=0;i<staff.length;i++){

            if(patterns[i][d]==="WORK"){

                workers++;

                if(staff[i].level===2){
                    level2++;
                }
            }
        }


        /*
           必要人数不足は大きなペナルティ
        */

        if(workers<needTotal){

            score+=
                (needTotal-workers)*1000;
        }


        /*
           レベル1だけの日は禁止
        */

        if(workers>0 && level2===0){

            score+=10000;
        }
    }


    return score;
}


/* =========================================
   勤務パターンを組み合わせる
========================================= */

function findWorkPatterns(
    staff,
    requests,
    days,
    needTotal
){

    let best=null;
    let bestScore=Infinity;


    /*
       何度も全員のパターンを作り直す
    */

    for(let attempt=0;attempt<3000;attempt++){

        const patterns=
            generateWorkPatterns(
                staff,
                requests,
                days
            );

        if(!patterns)continue;


        const score=
            evaluateWorkPatterns(
                patterns,
                staff,
                days,
                needTotal
            );


        if(score<bestScore){

            bestScore=score;
            best=patterns;
        }


        if(score===0){

            return patterns;
        }
    }


    return best;
}


/* =========================================
   シフト割当
========================================= */

function assignShifts(
    patterns,
    staff,
    requests,
    days,
    needHA,
    needHP
){

    const schedule=
        Array.from(
            {length:staff.length},
            ()=>Array(days).fill("休")
        );


    /*
       勤務・休みをセット
    */

    for(let i=0;i<staff.length;i++){

        for(let d=0;d<days;d++){

            if(patterns[i][d]==="WORK"){

                schedule[i][d]="WORK";

            }else{

                /*
                   希望有休なら有休
                */

                if(requests[i][d]==="有休"){

                    schedule[i][d]="有休";

                }else{

                    schedule[i][d]="休";
                }
            }
        }
    }


    /*
       日ごとにHA/HPを割り当てる
    */

    for(let d=0;d<days;d++){

        const workers=[];

        for(let i=0;i<staff.length;i++){

            if(schedule[i][d]==="WORK"){
                workers.push(i);
            }
        }


        if(workers.length<needHA+needHP){
            return null;
        }


        /*
           HP→HA禁止を考慮して候補を作る
        */

        const validHA=
            workers.filter(i=>{

                if(d===0)return true;

                return schedule[i][d-1]!=="HP";
            });


        if(validHA.length<needHA){
            return null;
        }


        /*
           前日の勤務をなるべく継続
        */

        let ordered=
            workers.slice().sort((a,b)=>{

                const pa=
                    d>0 ? schedule[a][d-1] : "";

                const pb=
                    d>0 ? schedule[b][d-1] : "";

                /*
                   HP継続を優先
                */

                if(pa==="HP" && pb!=="HP")return -1;
                if(pb==="HP" && pa!=="HP")return 1;

                /*
                   希望を優先
                */

                const ra=requests[a][d];
                const rb=requests[b][d];

                if(ra==="HA" && rb!=="HA")return -1;
                if(rb==="HA" && ra!=="HA")return 1;

                return Math.random()-.5;
            });


        /*
           まずHAを決める
        */

        const ha=[];

        for(const i of ordered){

            if(ha.length>=needHA)break;

            if(validHA.includes(i)){

                /*
                   HP希望なら後回し
                */

                if(requests[i][d]==="HP"){
                    continue;
                }

                ha.push(i);
            }
        }


        /*
           足りなければ追加
        */

        if(ha.length<needHA){

            for(const i of validHA){

                if(ha.includes(i))continue;

                ha.push(i);

                if(ha.length>=needHA)break;
            }
        }


        if(ha.length<needHA){
            return null;
        }


        /*
           残りからHP
        */

        const remaining=
            workers.filter(
                i=>!ha.includes(i)
            );


        if(remaining.length<needHP){
            return null;
        }


        /*
           HP希望を優先
        */

        remaining.sort((a,b)=>{

            const ra=requests[a][d];
            const rb=requests[b][d];

            if(ra==="HP" && rb!=="HP")return -1;
            if(rb==="HP" && ra!=="HP")return 1;

            return Math.random()-.5;
        });


        const hp=
            remaining.slice(0,needHP);


        if(hp.length<needHP){
            return null;
        }


        /*
           決定
        */

        for(const i of workers){

            if(ha.includes(i)){

                schedule[i][d]="HA";

            }else if(hp.includes(i)){

                schedule[i][d]="HP";

            }else{

                /*
                   必要人数以上の勤務者がいる場合は
                   余剰勤務としてHA/HPのどちらかにする
                   必要人数だけを基本とする
                */

                schedule[i][d]="休";
            }
        }


        /*
           レベル1勤務時はレベル2がいるか
        */

        const working=
            workers.filter(
                i=>
                    schedule[i][d]==="HA"||
                    schedule[i][d]==="HP"
            );


        const hasLv1=
            working.some(
                i=>staff[i].level===1
            );

        const hasLv2=
            working.some(
                i=>staff[i].level===2
            );

        if(hasLv1&&!hasLv2){
            return null;
        }
    }


    return schedule;
}


/* =========================================
   最終チェック
========================================= */

function validateSchedule(
    schedule,
    staff,
    requests,
    days,
    needHA,
    needHP
){

    for(let d=0;d<days;d++){

        let ha=0;
        let hp=0;

        let lv1=false;
        let lv2=false;

        for(let i=0;i<staff.length;i++){

            const s=schedule[i][d];


            /*
               希望
            */

            if(
                requests[i][d]==="休" &&
                s!=="休"
            ){
                return false;
            }

            if(
                requests[i][d]==="有休" &&
                s!=="有休"
            ){
                return false;
            }


            if(s==="HA")ha++;
            if(s==="HP")hp++;


            if(s==="HA"||s==="HP"){

                if(staff[i].level===1)lv1=true;
                if(staff[i].level===2)lv2=true;
            }


            /*
               HP→HA
            */

            if(
                d>0 &&
                schedule[i][d-1]==="HP" &&
                s==="HA"
            ){
                return false;
            }
        }


        if(ha<needHA)return false;
        if(hp<needHP)return false;

        if(lv1&&!lv2)return false;
    }


    /*
       連勤
    */

    for(let i=0;i<staff.length;i++){

        let run=0;

        for(let d=0;d<days;d++){

            const working=
                schedule[i][d]==="HA"||
                schedule[i][d]==="HP";

            if(working){

                run++;

                if(run>4)return false;

            }else{

                run=0;
            }
        }
    }


    /*
       1連勤禁止
    */

    for(let i=0;i<staff.length;i++){

        for(let d=0;d<days;d++){

            const working=
                schedule[i][d]==="HA"||
                schedule[i][d]==="HP";

            if(!working)continue;

            const prev=
                d>0 &&
                (
                    schedule[i][d-1]==="HA"||
                    schedule[i][d-1]==="HP"
                );

            const next=
                d<days-1 &&
                (
                    schedule[i][d+1]==="HA"||
                    schedule[i][d+1]==="HP"
                );

            if(!prev&&!next){
                return false;
            }
        }
    }


    /*
       HA/HPの単独1日をできるだけ防ぐ
    */

    for(let i=0;i<staff.length;i++){

        for(let d=0;d<days;d++){

            const s=schedule[i][d];

            if(s!=="HA"&&s!=="HP")continue;


            const prev=
                d>0?schedule[i][d-1]:null;

            const next=
                d<days-1?schedule[i][d+1]:null;


            /*
               勤務→別勤務→勤務は許可
               ただしHP→HAだけは禁止済み
            */

            if(
                prev==="休" &&
                next==="休"
            ){
                return false;
            }

            if(
                prev==="有休" &&
                next==="休"
            ){
                return false;
            }
        }
    }


    return true;
}


/* =========================================
   シフト生成
========================================= */

function generateSchedule(){

    const staff=getStaff();

    const days=getDays();

    const needHA=
        Number(document.getElementById("needHA").value);

    const needHP=
        Number(document.getElementById("needHP").value);


    /*
       必要人数
    */

    const required=
        needHA+needHP;


    if(staff.length<required){

        showError(
            `現在の設定では最低${required}人必要です。<br>
            HA ${needHA}人 + HP ${needHP}人です。`
        );

        return;
    }


    const requests=
        getRequests(staff,days);


    /*
       有休チェック
    */

    for(let i=0;i<staff.length;i++){

        let count=0;

        for(let d=0;d<days;d++){

            if(requests[i][d]==="有休"){
                count++;
            }
        }

        if(count>staff[i].paid){

            showError(
                `${staff[i].name}さんの有休指定が${count}日あります。<br>
                設定された有休日数は${staff[i].paid}日です。`
            );

            return;
        }
    }


    /*
       公休＋有休が月の日数を超えないか
    */

    for(let i=0;i<staff.length;i++){

        if(staff[i].off+staff[i].paid>days){

            showError(
                `${staff[i].name}さんの公休＋有休が${days}日を超えています。`
            );

            return;
        }
    }


    /*
       勤務パターンを探す
    */

    let best=null;


    for(let attempt=0;attempt<30;attempt++){

        const patterns=
            findWorkPatterns(
                staff,
                requests,
                days,
                required
            );

        if(!patterns)continue;


        /*
           シフトを何パターンか試す
        */

        for(let t=0;t<100;t++){

            const shuffledPatterns=
                patterns.map(p=>p.slice());


            const schedule=
                assignShifts(
                    shuffledPatterns,
                    staff,
                    requests,
                    days,
                    needHA,
                    needHP
                );


            if(!schedule)continue;


            if(
                validateSchedule(
                    schedule,
                    staff,
                    requests,
                    days,
                    needHA,
                    needHP
                )
            ){

                best=schedule;
                break;
            }
        }


        if(best)break;
    }


    if(!best){

        showError(
            `条件を満たすシフトを作成できませんでした。<br><br>
            現在の条件が非常に厳しい可能性があります。<br>
            特に「公休数」「希望休」「HA/HP必要人数」の組み合わせを確認してください。`
        );

        return;
    }


    displaySchedule(
        best,
        staff,
        days
    );
}


/* =========================================
   結果表示
========================================= */

function displaySchedule(
    schedule,
    staff,
    days
){

    let html=`
    <div class="success">
    ✅ シフトを作成しました！
    </div>

    <div class="legend">
    <span class="lha">HA</span>
    <span class="lhp">HP</span>
    <span class="loff">休</span>
    <span class="lpaid">有休</span>
    </div>

    <div class="scroll">

    <table>

    <tr>
    <th>名前</th>
    `;

    for(let d=1;d<=days;d++){
        html+=`<th>${d}</th>`;
    }

    html+=`
    <th>HA</th>
    <th>HP</th>
    </tr>`;


    for(let i=0;i<staff.length;i++){

        let ha=0;
        let hp=0;

        html+=`
        <tr>
        <th>
        ${escapeHtml(staff[i].name)}
        <br>
        <small>Lv.${staff[i].level}</small>
        </th>`;

        for(let d=0;d<days;d++){

            const s=schedule[i][d];

            let cls="";

            if(s==="HA"){
                cls="shift-HA";
                ha++;
            }

            if(s==="HP"){
                cls="shift-HP";
                hp++;
            }

            if(s==="休"){
                cls="shift-off";
            }

            if(s==="有休"){
                cls="shift-paid";
            }

            html+=`
            <td class="${cls}">
            ${s}
            </td>`;
        }

        html+=`
        <td>${ha}</td>
        <td>${hp}</td>
        </tr>`;
    }


    /*
       日別人数
    */

    html+=`
    <tr>
    <th>HA人数</th>`;

    for(let d=0;d<days;d++){

        let c=0;

        for(let i=0;i<staff.length;i++){

            if(schedule[i][d]==="HA")c++;
        }

        html+=`<td>${c}</td>`;
    }

    html+=`
    <td colspan="2"></td>
    </tr>`;


    html+=`
    <tr>
    <th>HP人数</th>`;

    for(let d=0;d<days;d++){

        let c=0;

        for(let i=0;i<staff.length;i++){

            if(schedule[i][d]==="HP")c++;
        }

        html+=`<td>${c}</td>`;
    }

    html+=`
    <td colspan="2"></td>
    </tr>
    </table>
    </div>
    `;


    document.getElementById("result").innerHTML=html;
}


/* =========================================
   その他
========================================= */

function clearRequests(){

    document
    .querySelectorAll("#requestArea select")
    .forEach(x=>x.value="");
}


function showError(message){

    document.getElementById("result").innerHTML=`
    <div class="error">
    <strong>⚠️ シフトを作成できません</strong>
    <br><br>
    ${message}
    </div>`;
}


function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================
   初期化
========================================= */

setDefaultMonth();
buildStaffSettings();

</script>
