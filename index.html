<script>

/* =========================================================
   データ
========================================================= */

let days = 0;

let staff = [];
let requests = [];
let previousState = [];

let schedule = [];

/* =========================================================
   DOM
========================================================= */

const yearSelect =
  document.getElementById("year");

const monthSelect =
  document.getElementById("month");

const staffCountSelect =
  document.getElementById("staffCount");

const maxConsecutiveSelect =
  document.getElementById("maxConsecutive");

/* =========================================================
   年・月
========================================================= */

const today = new Date();

for (
  let y = today.getFullYear() - 1;
  y <= today.getFullYear() + 3;
  y++
) {

  const option =
    document.createElement("option");

  option.value = y;
  option.textContent = y + "年";

  if (y === today.getFullYear()) {
    option.selected = true;
  }

  yearSelect.appendChild(option);

}

for (let m = 1; m <= 12; m++) {

  const option =
    document.createElement("option");

  option.value = m;
  option.textContent = m + "月";

  if (m === today.getMonth() + 1) {
    option.selected = true;
  }

  monthSelect.appendChild(option);

}

/* =========================================================
   月の日数
========================================================= */

function getDaysInSelectedMonth() {

  const year =
    Number(yearSelect.value);

  const month =
    Number(monthSelect.value);

  return new Date(
    year,
    month,
    0
  ).getDate();

}

/* =========================================================
   月変更
========================================================= */

function changeMonth() {

  const oldRequests =
    requests;

  days =
    getDaysInSelectedMonth();

  document.getElementById("daysLabel")
    .textContent = days;

  requests = [];

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    requests[s] = [];

    for (
      let d = 0;
      d < days;
      d++
    ) {

      requests[s][d] =
        oldRequests[s]?.[d] || "";

    }

  }

  staff.forEach(person => {

    person.publicHoliday =
      Math.min(
        Number(person.publicHoliday) || 0,
        days
      );

    person.paidLeave =
      Math.min(
        Number(person.paidLeave) || 0,
        days
      );

  });

  renderAll();

}

/* =========================================================
   スタッフ初期値
========================================================= */

function createStaff() {

  const count =
    Number(staffCountSelect.value);

  const oldStaff =
    staff;

  const oldPrevious =
    previousState;

  staff = [];
  previousState = [];

  for (
    let i = 0;
    i < count;
    i++
  ) {

    staff.push({

      name:
        oldStaff[i]?.name ||
        String.fromCharCode(65 + i),

      level:
        oldStaff[i]?.level || 2,

      publicHoliday:
        oldStaff[i]?.publicHoliday ?? 11,

      paidLeave:
        oldStaff[i]?.paidLeave ?? 0

    });

    previousState.push({

      shift:
        oldPrevious[i]?.shift || "休",

      consecutive:
        oldPrevious[i]?.consecutive ?? 0

    });

  }

}

/* =========================================================
   希望入力初期化
========================================================= */

function createRequests() {

  const old =
    requests;

  requests = [];

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    requests[s] = [];

    for (
      let d = 0;
      d < days;
      d++
    ) {

      requests[s][d] =
        old[s]?.[d] || "";

    }

  }

}

/* =========================================================
   全UI
========================================================= */

function renderAll() {

  renderPrevious();

  renderStaff();

  renderRequests();

}

/* =========================================================
   前月末
========================================================= */

function renderPrevious() {

  const container =
    document.getElementById(
      "previousContainer"
    );

  container.innerHTML = "";

  staff.forEach((person, i) => {

    const div =
      document.createElement("div");

    div.className =
      "staff-card";

    div.innerHTML = `

      <div class="staff-title">
        ${escapeHtml(person.name)}
      </div>

      <div class="row">

        <div class="field">

          <label>
            前月最終日
          </label>

          <select
            data-prev-staff="${i}"
            data-prev-field="shift"
          >

            <option value="HA"
              ${previousState[i].shift === "HA" ? "selected" : ""}>
              HA
            </option>

            <option value="HP"
              ${previousState[i].shift === "HP" ? "selected" : ""}>
              HP
            </option>

            <option value="休"
              ${previousState[i].shift === "休" ? "selected" : ""}>
              休
            </option>

            <option value="有休"
              ${previousState[i].shift === "有休" ? "selected" : ""}>
              有休
            </option>

          </select>

        </div>

        <div class="field">

          <label>
            前月末の連勤
          </label>

          <select
            data-prev-staff="${i}"
            data-prev-field="consecutive"
          >

            ${createConsecutiveOptions(
              previousState[i].consecutive
            )}

          </select>

        </div>

      </div>

    `;

    container.appendChild(div);

  });

}

function createConsecutiveOptions(selected) {

  const max =
    Number(maxConsecutiveSelect.value);

  let html = "";

  for (
    let i = 0;
    i <= max;
    i++
  ) {

    html += `
      <option
        value="${i}"
        ${Number(selected) === i ? "selected" : ""}
      >
        ${i === 0 ? "0（休み）" : i + "連勤目"}
      </option>
    `;

  }

  return html;

}

/* =========================================================
   スタッフ表示
========================================================= */

function renderStaff() {

  const container =
    document.getElementById(
      "staffContainer"
    );

  container.innerHTML = "";

  staff.forEach((person, i) => {

    const div =
      document.createElement("div");

    div.className =
      "staff-card";

    div.innerHTML = `

      <div class="staff-title">
        スタッフ${i + 1}
      </div>

      <div class="row">

        <div class="field">

          <label>名前</label>

          <input
            type="text"
            value="${escapeHtml(person.name)}"
            data-staff="${i}"
            data-field="name"
          >

        </div>

        <div class="field">

          <label>レベル</label>

          <select
            data-staff="${i}"
            data-field="level"
          >

            <option value="1"
              ${person.level === 1 ? "selected" : ""}>
              1：研修中
            </option>

            <option value="2"
              ${person.level === 2 ? "selected" : ""}>
              2：独り立ち
            </option>

          </select>

        </div>

        <div class="field">

          <label>公休</label>

          <input
            type="number"
            min="0"
            max="${days}"
            value="${person.publicHoliday}"
            data-staff="${i}"
            data-field="publicHoliday"
          >

        </div>

        <div class="field">

          <label>有休</label>

          <input
            type="number"
            min="0"
            max="${days}"
            value="${person.paidLeave}"
            data-staff="${i}"
            data-field="paidLeave"
          >

        </div>

      </div>

    `;

    container.appendChild(div);

  });

}

/* =========================================================
   希望表
========================================================= */

function renderRequests() {

  const head =
    document.getElementById(
      "requestHead"
    );

  const body =
    document.getElementById(
      "requestBody"
    );

  head.innerHTML = "";
  body.innerHTML = "";

  let header =
    "<tr><th>名前</th>";

  for (
    let d = 0;
    d < days;
    d++
  ) {

    header += `
      <th class="date-head">
        ${d + 1}日
      </th>
    `;

  }

  header += "</tr>";

  head.innerHTML =
    header;

  staff.forEach((person, s) => {

    let row =
      `<tr>
        <td>
          ${escapeHtml(person.name)}
        </td>`;

    for (
      let d = 0;
      d < days;
      d++
    ) {

      const value =
        requests[s][d];

      const cls =
        requestClass(value);

      row += `

        <td class="${cls}">

          <select
            class="request-select"
            data-s="${s}"
            data-d="${d}"
          >

            <option value=""
              ${value === "" ? "selected" : ""}>
              -
            </option>

            <option value="HA"
              ${value === "HA" ? "selected" : ""}>
              HA希望
            </option>

            <option value="HP"
              ${value === "HP" ? "selected" : ""}>
              HP希望
            </option>

            <option value="休"
              ${value === "休" ? "selected" : ""}>
              休
            </option>

            <option value="有休"
              ${value === "有休" ? "selected" : ""}>
              有休
            </option>

          </select>

        </td>

      `;

    }

    row += "</tr>";

    body.innerHTML += row;

  });

}

function requestClass(value) {

  if (value === "HA")
    return "request-ha";

  if (value === "HP")
    return "request-hp";

  if (value === "休")
    return "request-rest";

  if (value === "有休")
    return "request-paid";

  return "request-none";

}

/* =========================================================
   入力イベント
========================================================= */

document.addEventListener(
  "change",
  event => {

    const target =
      event.target;

    if (
      target.dataset.staff !== undefined
    ) {

      const i =
        Number(target.dataset.staff);

      const field =
        target.dataset.field;

      if (field === "name") {

        staff[i].name =
          target.value ||
          String.fromCharCode(65 + i);

        renderRequests();
        renderPrevious();

      }

      if (field === "level") {

        staff[i].level =
          Number(target.value);

      }

      if (
        field === "publicHoliday"
      ) {

        staff[i].publicHoliday =
          Math.max(
            0,
            Math.min(
              days,
              Number(target.value) || 0
            )
          );

        target.value =
          staff[i].publicHoliday;

      }

      if (
        field === "paidLeave"
      ) {

        staff[i].paidLeave =
          Math.max(
            0,
            Math.min(
              days,
              Number(target.value) || 0
            )
          );

        target.value =
          staff[i].paidLeave;

      }

    }

    if (
      target.dataset.prevStaff !== undefined
    ) {

      const i =
        Number(target.dataset.prevStaff);

      const field =
        target.dataset.prevField;

      if (field === "shift") {

        previousState[i].shift =
          target.value;

        if (
          target.value === "休" ||
          target.value === "有休"
        ) {

          previousState[i].consecutive = 0;

        }

      }

      if (
        field === "consecutive"
      ) {

        previousState[i].consecutive =
          Number(target.value);

      }

    }

    if (
      target.classList.contains(
        "request-select"
      )
    ) {

      const s =
        Number(target.dataset.s);

      const d =
        Number(target.dataset.d);

      requests[s][d] =
        target.value;

      target.closest("td").className =
        requestClass(
          target.value
        );

    }

  }
);

/* =========================================================
   最大連勤変更
========================================================= */

maxConsecutiveSelect.addEventListener(
  "change",
  () => {

    const max =
      Number(
        maxConsecutiveSelect.value
      );

    previousState.forEach(state => {

      if (
        state.consecutive > max
      ) {

        state.consecutive =
          max;

      }

    });

    renderPrevious();

  }
);

/* =========================================================
   月変更
========================================================= */

yearSelect.addEventListener(
  "change",
  changeMonth
);

monthSelect.addEventListener(
  "change",
  changeMonth
);

/* =========================================================
   人数変更
========================================================= */

staffCountSelect.addEventListener(
  "change",
  () => {

    createStaff();

    createRequests();

    renderAll();

  }
);

/* =========================================================
   ユーティリティ
========================================================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

function shuffle(array) {

  const result =
    [...array];

  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];

  }

  return result;

}

/* =========================================================
   希望チェック
========================================================= */

function validateRequests() {

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    let paid = 0;
    let rest = 0;

    for (
      let d = 0;
      d < days;
      d++
    ) {

      if (
        requests[s][d] === "有休"
      ) {

        paid++;

      }

      if (
        requests[s][d] === "休"
      ) {

        rest++;

      }

    }

    if (
      paid >
      Number(staff[s].paidLeave)
    ) {

      return `${staff[s].name}さんの有休希望が、設定した有休数を超えています。`;

    }

    if (
      rest >
      Number(staff[s].publicHoliday)
    ) {

      return `${staff[s].name}さんの休希望が、設定した公休数を超えています。`;

    }

  }

  return "";

}

/* =========================================================
   固定休
========================================================= */

function isFixedOff(s, d) {

  return (
    requests[s][d] === "休" ||
    requests[s][d] === "有休"
  );

}

/* =========================================================
   組み合わせ
========================================================= */

function combinations(
  array,
  count
) {

  if (count === 0) {
    return [[]];
  }

  if (array.length < count) {
    return [];
  }

  const result = [];

  function dfs(
    start,
    chosen
  ) {

    if (
      chosen.length === count
    ) {

      result.push(
        [...chosen]
      );

      return;

    }

    for (
      let i = start;
      i < array.length;
      i++
    ) {

      chosen.push(
        array[i]
      );

      dfs(
        i + 1,
        chosen
      );

      chosen.pop();

    }

  }

  dfs(0, []);

  return result;

}

/* =========================================================
   月全体の勤務人数を計算
========================================================= */

function getWorkTarget() {

  const offTarget =
    staff.map(
      person =>
        Number(person.publicHoliday || 0) +
        Number(person.paidLeave || 0)
    );

  const totalPossible =
    staff.length * days;

  const totalOff =
    offTarget.reduce(
      (sum, value) =>
        sum + value,
      0
    );

  const totalWork =
    totalPossible -
    totalOff;

  return {
    offTarget,
    totalWork
  };

}

/* =========================================================
   1日の理想勤務人数
========================================================= */

function createDailyTargets(
  totalWork
) {

  const base =
    Math.floor(
      totalWork / days
    );

  const remainder =
    totalWork % days;

  const targets =
    new Array(days)
      .fill(base);

  /*
    例えば190人日 / 30日なら

    6人の日 → 20日
    7人の日 → 10日

    のようにする。
  */

  for (
    let i = 0;
    i < remainder;
    i++
  ) {

    /*
      なるべく均等な間隔で
      +1する日を配置
    */

    const day =
      Math.floor(
        i * days / remainder
      );

    targets[
      Math.min(
        day,
        days - 1
      )
    ]++;

  }

  return targets;

}

/* =========================================================
   今日の勤務人数候補
========================================================= */

function getWorkCountCandidates(
  target,
  minRequired,
  maxAvailable
) {

  const set =
    new Set();

  /*
    目標人数を最優先
  */

  [
    target,
    target - 1,
    target + 1,
    target - 2,
    target + 2,
    minRequired,
    maxAvailable
  ].forEach(count => {

    if (
      count >= minRequired &&
      count <= maxAvailable
    ) {

      set.add(count);

    }

  });

  return [...set]
    .sort(
      (a, b) =>
        Math.abs(a - target) -
        Math.abs(b - target)
    );

}

/* =========================================================
   未来に必要な休みを計算
========================================================= */

function futureFixedOffCount(
  s,
  startDay
) {

  let count = 0;

  for (
    let d = startDay;
    d < days;
    d++
  ) {

    if (
      isFixedOff(s, d)
    ) {

      count++;

    }

  }

  return count;

}

/* =========================================================
   今日の勤務候補
========================================================= */

function makeDailyCandidates(
  day,
  previousShift,
  run,
  offCount,
  offTarget,
  targetWork,
  maxConsecutive
) {

  const haNeed =
    Number(
      document.getElementById(
        "haNeed"
      ).value
    );

  const hpNeed =
    Number(
      document.getElementById(
        "hpNeed"
      ).value
    );

  const minimum =
    haNeed + hpNeed;

  const all =
    staff.map(
      (_, i) => i
    );

  const remainingAfterToday =
    days - day - 1;

  const mustWork =
    new Set();

  const mustOff =
    new Set();

  /*
    各スタッフについて、
    今日勤務必須 / 今日休み必須を決定
  */

  for (
    const s of all
  ) {

    /*
      希望休・有休は必ず休み
    */

    if (
      isFixedOff(s, day)
    ) {

      mustOff.add(s);

      continue;

    }

    /*
      最大連勤に達している場合は
      今日休み必須
    */

    if (
      run[s] >= maxConsecutive
    ) {

      mustOff.add(s);

      continue;

    }

    /*
      すでに必要な休みを
      全部消化している
      →これ以上休めない
    */

    if (
      offCount[s] >= offTarget[s]
    ) {

      mustWork.add(s);

      continue;

    }

    /*
      今日休まないと、
      残りの日数では必要な休みを
      消化できなくなる場合
    */

    const needOff =
      offTarget[s] -
      offCount[s];

    if (
      needOff >
      remainingAfterToday
    ) {

      mustOff.add(s);

    }

  }

  /*
    矛盾チェック
  */

  for (
    const s of mustWork
  ) {

    if (
      mustOff.has(s)
    ) {

      return [];

    }

  }

  const available =
    all.filter(
      s => !mustOff.has(s)
    );

  if (
    available.length <
    minimum
  ) {

    return [];

  }

  /*
    今日の勤務人数候補
  */

  const countCandidates =
    getWorkCountCandidates(
      targetWork,
      Math.max(
        minimum,
        mustWork.size
      ),
      available.length
    );

  const candidates = [];

  for (
    const workCount of countCandidates
  ) {

    const flexible =
      available.filter(
        s => !mustWork.has(s)
      );

    const need =
      workCount -
      mustWork.size;

    if (
      need < 0 ||
      need > flexible.length
    ) {

      continue;

    }

    let workSets =
      combinations(
        flexible,
        need
      );

    /*
      組み合わせが大量になる場合は
      ランダム性を持たせて上限を設ける。
    */

    if (
      workSets.length > 180
    ) {

      workSets =
        shuffle(workSets)
          .slice(0, 180);

    }

    for (
      const extra of workSets
    ) {

      const working =
        [
          ...mustWork,
          ...extra
        ];

      const workingSet =
        new Set(working);

      /*
        レベル1がいる場合、
        レベル2が最低1人必要
      */

      const hasLevel1 =
        working.some(
          s =>
            Number(
              staff[s].level
            ) === 1
        );

      const hasLevel2 =
        working.some(
          s =>
            Number(
              staff[s].level
            ) === 2
        );

      if (
        hasLevel1 &&
        !hasLevel2
      ) {

        continue;

      }

      /*
        今日休む人について、
        月末までの休日日数が成立するか確認
      */

      let valid =
        true;

      for (
        const s of all
      ) {

        const willWork =
          workingSet.has(s);

        const newOff =
          offCount[s] +
          (
            willWork
              ? 0
              : 1
          );

        if (
          newOff >
          offTarget[s]
        ) {

          valid = false;
          break;

        }

        const needFutureOff =
          offTarget[s] -
          newOff;

        if (
          needFutureOff <
          0 ||
          needFutureOff >
          remainingAfterToday
        ) {

          valid = false;
          break;

        }

        /*
          未来の固定休が、
          必要な休み数を超えていないか
        */

        const fixedFuture =
          futureFixedOffCount(
            s,
            day + 1
          );

        if (
          fixedFuture >
          needFutureOff
        ) {

          valid = false;
          break;

        }

      }

      if (!valid)
        continue;

      /*
        HA / HPを割り振る
      */

      const shifts =
        makeShiftCandidates(
          working,
          day,
          previousShift,
          haNeed,
          hpNeed
        );

      for (
        const shift of shifts
      ) {

        let score =
          shift.score;

        /*
          目標人数に近いほど高評価
        */

        score -=
          Math.abs(
            workCount -
            targetWork
          ) * 500;

        /*
          追加勤務はOK。
          ただし最低人数から大きく離れるほど
          少しずつ減点。
        */

        candidates.push({

          ha:
            shift.ha,

          hp:
            shift.hp,

          score

        });

      }

    }

  }

  candidates.sort(
    (a, b) =>
      b.score - a.score
  );

  /*
    上位候補だけを返す。
  */

  return candidates.slice(
    0,
    100
  );

}

/* =========================================================
   HA / HP候補
========================================================= */

function makeShiftCandidates(
  working,
  day,
  previousShift,
  haNeed,
  hpNeed
) {

  const result = [];

  const maxHA =
    working.length -
    hpNeed;

  if (
    maxHA < haNeed
  ) {

    return [];

  }

  /*
    追加勤務がある場合、
    HA/HPの人数比も極端にならないように
    基本的には最低人数比を参考にする。
  */

  const minimumTotal =
    haNeed + hpNeed;

  let idealHA =
    haNeed;

  if (
    minimumTotal > 0
  ) {

    idealHA =
      Math.round(
        working.length *
        haNeed /
        minimumTotal
      );

  }

  idealHA =
    Math.max(
      haNeed,
      Math.min(
        maxHA,
        idealHA
      )
    );

  const haCounts =
    new Set([
      haNeed,
      idealHA,
      idealHA - 1,
      idealHA + 1,
      maxHA
    ]);

  const sortedCounts =
    [...haCounts]
      .filter(
        count =>
          count >= haNeed &&
          count <= maxHA
      )
      .sort(
        (a, b) =>
          Math.abs(a - idealHA) -
          Math.abs(b - idealHA)
      );

  for (
    const haCount of sortedCounts
  ) {

    /*
      前日HPの人はHA不可
    */

    const eligibleHA =
      working.filter(
        s =>
          previousShift[s] !== "HP"
      );

    if (
      eligibleHA.length <
      haCount
    ) {

      continue;

    }

    const haSets =
      combinations(
        eligibleHA,
        haCount
      );

    /*
      全部試すと多い場合は
      希望スコア上位を優先。
    */

    haSets.sort(
      (a, b) =>
        getShiftSetScore(
          b,
          "HA",
          day,
          previousShift
        ) -
        getShiftSetScore(
          a,
          "HA",
          day,
          previousShift
        )
    );

    const limitedHA =
      haSets.slice(
        0,
        20
      );

    for (
      const ha of limitedHA
    ) {

      const haSet =
        new Set(ha);

      const hp =
        working.filter(
          s => !haSet.has(s)
        );

      if (
        hp.length < hpNeed
      ) {

        continue;

      }

      let score = 0;

      score +=
        getShiftSetScore(
          ha,
          "HA",
          day,
          previousShift
        );

      score +=
        getShiftSetScore(
          hp,
          "HP",
          day,
          previousShift
        );

      /*
        HA人数が理想人数から
        離れるほど少し減点
      */

      score -=
        Math.abs(
          haCount -
          idealHA
        ) * 5;

      result.push({

        ha:
          ha,

        hp:
          hp,

        score

      });

    }

  }

  result.sort(
    (a, b) =>
      b.score - a.score
  );

  return result.slice(
    0,
    40
  );

}

/* =========================================================
   シフト組み合わせ評価
========================================================= */

function getShiftSetScore(
  set,
  shift,
  day,
  previousShift
) {

  let score = 0;

  for (
    const s of set
  ) {

    const request =
      requests[s][day];

    /*
      希望一致
    */

    if (
      request === shift
    ) {

      score += 100;

    }

    /*
      希望と違う場合は軽く減点
    */

    if (
      (
        request === "HA" ||
        request === "HP"
      ) &&
      request !== shift
    ) {

      score -= 30;

    }

    /*
      前日と同じ勤務を少し優先
    */

    if (
      previousShift[s] === shift
    ) {

      score += 15;

    }

  }

  return score;

}

/* =========================================================
   スケジュール作成
   ★バックトラッキング方式
========================================================= */

function generateSchedule() {

  const haNeed =
    Number(
      document.getElementById(
        "haNeed"
      ).value
    );

  const hpNeed =
    Number(
      document.getElementById(
        "hpNeed"
      ).value
    );

  const minimum =
    haNeed + hpNeed;

  if (
    minimum > staff.length
  ) {

    return {
      error:
        `HA${haNeed}人＋HP${hpNeed}人なので、` +
        `最低${minimum}人必要ですが、` +
        `スタッフは${staff.length}人です。`
    };

  }

  const maxConsecutive =
    Number(
      maxConsecutiveSelect.value
    );

  const {
    offTarget,
    totalWork
  } =
    getWorkTarget();

  /*
    公休＋有休が月の日数を超えていないか
  */

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    if (
      offTarget[s] > days
    ) {

      return {
        error:
          `${staff[s].name}さんの公休＋有休が月の日数を超えています。`
      };

    }

  }

  /*
    月全体で最低人数を確保できるか
  */

  if (
    totalWork <
    minimum * days
  ) {

    return {
      error:
        `公休・有休を考慮すると、` +
        `月全体の勤務日数が不足しています。`
    };

  }

  /*
    1日の理想人数
  */

  const dailyTargets =
    createDailyTargets(
      totalWork
    );

  /*
    希望休チェック
  */

  const requestError =
    validateRequests();

  if (
    requestError
  ) {

    return {
      error:
        requestError
    };

  }

  /*
    前月状態を正規化
  */

  const initialRun =
    previousState.map(
      state => {

        if (
          state.shift === "休" ||
          state.shift === "有休"
        ) {

          return 0;

        }

        return Number(
          state.consecutive
        ) || 0;

      }
    );

  const initialShift =
    previousState.map(
      state =>
        state.shift || "休"
    );

  /*
    試行回数
  */

  const ATTEMPTS = 80;

  let bestSchedule = null;
  let bestScore = -Infinity;

  for (
    let attempt = 0;
    attempt < ATTEMPTS;
    attempt++
  ) {

    /*
      毎回少し違う候補順にする
    */

    const result =
      Array.from(
        {
          length:
            staff.length
        },
        () =>
          new Array(days)
            .fill(null)
      );

    const offCount =
      new Array(
        staff.length
      ).fill(0);

    const run =
      [...initialRun];

    const prevShift =
      [...initialShift];

    let nodeCount = 0;

    /*
      深さ優先探索
    */

    function search(day) {

      /*
        安全装置
      */

      nodeCount++;

      if (
        nodeCount > 25000
      ) {

        return false;

      }

      /*
        月末まで到達
      */

      if (
        day >= days
      ) {

        for (
          let s = 0;
          s < staff.length;
          s++
        ) {

          if (
            offCount[s] !==
            offTarget[s]
          ) {

            return false;

          }

        }

        return true;

      }

      /*
        今日の候補
      */

      let candidates =
        makeDailyCandidates(
          day,
          prevShift,
          run,
          offCount,
          offTarget,
          dailyTargets[day],
          maxConsecutive
        );

      if (
        candidates.length === 0
      ) {

        return false;

      }

      /*
        同じ条件でも毎回少し順番を変える
      */

      if (
        candidates.length > 1
      ) {

        const top =
          candidates.slice(
            0,
            Math.min(
              15,
              candidates.length
            )
          );

        const rest =
          candidates.slice(
            15
          );

        candidates =
          [
            ...shuffle(top),
            ...rest
          ];

      }

      for (
        const candidate of candidates
      ) {

        const working =
          new Set([
            ...candidate.ha,
            ...candidate.hp
          ]);

        /*
          今日の状態を保存
        */

        const oldRun =
          [...run];

        const oldOff =
          [...offCount];

        const oldPrev =
          [...prevShift];

        /*
          今日をセット
        */

        for (
          let s = 0;
          s < staff.length;
          s++
        ) {

          if (
            working.has(s)
          ) {

            if (
              candidate.ha.includes(s)
            ) {

              result[s][day] =
                "HA";

            } else {

              result[s][day] =
                "HP";

            }

            run[s]++;

            prevShift[s] =
              result[s][day];

          }

          else {

            result[s][day] =
              requests[s][day] === "有休"
                ? "有休"
                : "休";

            offCount[s]++;

            run[s] = 0;

            prevShift[s] =
              result[s][day];

          }

        }

        /*
          次の日へ。
          ダメならここで元に戻して
          別候補を試す。
        */

        if (
          search(day + 1)
        ) {

          return true;

        }

        /*
          巻き戻し
        */

        for (
          let s = 0;
          s < staff.length;
          s++
        ) {

          result[s][day] =
            null;

          run[s] =
            oldRun[s];

          offCount[s] =
            oldOff[s];

          prevShift[s] =
            oldPrev[s];

        }

      }

      return false;

    }

    const success =
      search(0);

    if (!success)
      continue;

    /*
      完成したシフトを評価
    */

    let score = 0;

    /*
      希望一致
    */

    for (
      let s = 0;
      s < staff.length;
      s++
    ) {

      for (
        let d = 0;
        d < days;
        d++
      ) {

        if (
          requests[s][d] ===
          result[s][d]
        ) {

          score += 100;

        }

      }

    }

    /*
      1日の人数バランス
    */

    const workCounts = [];

    for (
      let d = 0;
      d < days;
      d++
    ) {

      let count = 0;

      for (
        let s = 0;
        s < staff.length;
        s++
      ) {

        if (
          result[s][d] === "HA" ||
          result[s][d] === "HP"
        ) {

          count++;

        }

      }

      workCounts.push(count);

      /*
        理想人数との差を強く評価
      */

      score -=
        Math.pow(
          count -
          dailyTargets[d],
          2
        ) * 500;

    }

    /*
      最大人数と最小人数の差も減点
    */

    const maxWork =
      Math.max(
        ...workCounts
      );

    const minWork =
      Math.min(
        ...workCounts
      );

    score -=
      (maxWork - minWork) * 100;

    /*
      単発勤務を少し減点
    */

    for (
      let s = 0;
      s < staff.length;
      s++
    ) {

      for (
        let d = 0;
        d < days;
        d++
      ) {

        const working =
          result[s][d] === "HA" ||
          result[s][d] === "HP";

        if (!working)
          continue;

        const beforeWorking =
          d === 0
            ? initialRun[s] > 0
            : (
                result[s][d - 1] === "HA" ||
                result[s][d - 1] === "HP"
              );

        const afterWorking =
          d === days - 1
            ? false
            : (
                result[s][d + 1] === "HA" ||
                result[s][d + 1] === "HP"
              );

        if (
          !beforeWorking &&
          !afterWorking
        ) {

          score -= 50;

        }

      }

    }

    if (
      score > bestScore
    ) {

      bestScore =
        score;

      bestSchedule =
        result.map(
          row => [...row]
        );

    }

  }

  if (
    !bestSchedule
  ) {

    return {
      error:
        "設定された条件をすべて満たすシフトを作成できませんでした。"
    };

  }

  return {
    schedule:
      bestSchedule
  };

}

/* =========================================================
   最終検証
========================================================= */

function validateSchedule(
  result
) {

  const haNeed =
    Number(
      document.getElementById(
        "haNeed"
      ).value
    );

  const hpNeed =
    Number(
      document.getElementById(
        "hpNeed"
      ).value
    );

  const max =
    Number(
      maxConsecutiveSelect.value
    );

  /*
    日ごとの最低人数
  */

  for (
    let d = 0;
    d < days;
    d++
  ) {

    let ha = 0;
    let hp = 0;

    const working = [];

    for (
      let s = 0;
      s < staff.length;
      s++
    ) {

      if (
        result[s][d] === "HA"
      ) {

        ha++;
        working.push(s);

      }

      if (
        result[s][d] === "HP"
      ) {

        hp++;
        working.push(s);

      }

    }

    if (
      ha < haNeed
    ) {

      return `${d + 1}日のHA人数が最低${haNeed}人を満たしていません。`;

    }

    if (
      hp < hpNeed
    ) {

      return `${d + 1}日のHP人数が最低${hpNeed}人を満たしていません。`;

    }

    /*
      レベル1勤務時は
      レベル2が最低1人
    */

    const hasLevel1 =
      working.some(
        s =>
          Number(
            staff[s].level
          ) === 1
      );

    const hasLevel2 =
      working.some(
        s =>
          Number(
            staff[s].level
          ) === 2
      );

    if (
      hasLevel1 &&
      !hasLevel2
    ) {

      return `${d + 1}日にレベル2スタッフが必要です。`;

    }

  }

  /*
    最大連勤
  */

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    let run =
      initialConsecutiveForValidation(
        s
      );

    for (
      let d = 0;
      d < days;
      d++
    ) {

      const working =
        result[s][d] === "HA" ||
        result[s][d] === "HP";

      if (
        working
      ) {

        run++;

        if (
          run > max
        ) {

          return `${staff[s].name}さんが${max}連勤を超えています。`;

        }

      }
      else {

        run = 0;

      }

    }

  }

  /*
    HP → 翌日HA
  */

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    if (
      previousState[s].shift === "HP" &&
      result[s][0] === "HA"
    ) {

      return `${staff[s].name}さんが前月末HP→今月1日HAになっています。`;

    }

    for (
      let d = 0;
      d < days - 1;
      d++
    ) {

      if (
        result[s][d] === "HP" &&
        result[s][d + 1] === "HA"
      ) {

        return `${staff[s].name}さんがHPの翌日にHAになっています。`;

      }

    }

  }

  /*
    希望休・有休
  */

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    for (
      let d = 0;
      d < days;
      d++
    ) {

      if (
        requests[s][d] === "休" &&
        result[s][d] !== "休"
      ) {

        return `${staff[s].name}さんの${d + 1}日休希望が反映されていません。`;

      }

      if (
        requests[s][d] === "有休" &&
        result[s][d] !== "有休"
      ) {

        return `${staff[s].name}さんの${d + 1}日有休希望が反映されていません。`;

      }

    }

  }

  /*
    公休＋有休の合計
  */

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    let off = 0;

    for (
      let d = 0;
      d < days;
      d++
    ) {

      if (
        result[s][d] === "休" ||
        result[s][d] === "有休"
      ) {

        off++;

      }

    }

    const target =
      Number(
        staff[s].publicHoliday
      ) +
      Number(
        staff[s].paidLeave
      );

    if (
      off !== target
    ) {

      return `${staff[s].name}さんの休日日数が設定値と一致していません。`;

    }

  }

  return "";

}

function initialConsecutiveForValidation(s) {

  if (
    previousState[s].shift === "休" ||
    previousState[s].shift === "有休"
  ) {

    return 0;

  }

  return Number(
    previousState[s].consecutive
  ) || 0;

}

/* =========================================================
   結果表示
========================================================= */

function renderResult() {

  const card =
    document.getElementById(
      "resultCard"
    );

  const head =
    document.getElementById(
      "resultHead"
    );

  const body =
    document.getElementById(
      "resultBody"
    );

  card.classList.remove(
    "hidden"
  );

  let header =
    "<tr><th>名前</th>";

  for (
    let d = 0;
    d < days;
    d++
  ) {

    header += `
      <th>
        ${d + 1}日
      </th>
    `;

  }

  header += "</tr>";

  head.innerHTML =
    header;

  body.innerHTML = "";

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    let row =
      `<tr>
        <td>
          ${escapeHtml(
            staff[s].name
          )}
        </td>`;

    for (
      let d = 0;
      d < days;
      d++
    ) {

      const value =
        schedule[s][d];

      let cls =
        "shift-rest";

      if (
        value === "HA"
      ) {

        cls =
          "shift-ha";

      }

      if (
        value === "HP"
      ) {

        cls =
          "shift-hp";

      }

      if (
        value === "有休"
      ) {

        cls =
          "shift-paid";

      }

      let mark = "";

      if (
        requests[s][d] === "HA"
      ) {

        mark =
          `<span class="request-mark">
            HA希望
          </span>`;

      }

      if (
        requests[s][d] === "HP"
      ) {

        mark =
          `<span class="request-mark">
            HP希望
          </span>`;

      }

      if (
        requests[s][d] === "休"
      ) {

        mark =
          `<span class="request-mark">
            休希望
          </span>`;

      }

      if (
        requests[s][d] === "有休"
      ) {

        mark =
          `<span class="request-mark">
            有休
          </span>`;

      }

      row += `
        <td class="${cls}">
          ${value}
          ${mark}
        </td>
      `;

    }

    row += "</tr>";

    body.innerHTML += row;

  }

}

/* =========================================================
   作成ボタン
========================================================= */

document.getElementById(
  "generateBtn"
).addEventListener(
  "click",
  () => {

    const message =
      document.getElementById(
        "message"
      );

    message.innerHTML = `
      <div class="success">
        シフトを作成しています……<br>
        勤務人数をできるだけ均等にしています。
      </div>
    `;

    setTimeout(() => {

      try {

        const result =
          generateSchedule();

        if (
          result.error
        ) {

          message.innerHTML = `
            <div class="error">
              ${escapeHtml(
                result.error
              )}
            </div>
          `;

          return;

        }

        schedule =
          result.schedule;

        const finalError =
          validateSchedule(
            schedule
          );

        if (
          finalError
        ) {

          message.innerHTML = `
            <div class="error">
              ${escapeHtml(
                finalError
              )}
            </div>
          `;

          return;

        }

        renderResult();

        /*
          実際の1日ごとの勤務人数
        */

        const distribution = [];

        for (
          let d = 0;
          d < days;
          d++
        ) {

          let count = 0;

          for (
            let s = 0;
            s < staff.length;
            s++
          ) {

            if (
              schedule[s][d] === "HA" ||
              schedule[s][d] === "HP"
            ) {

              count++;

            }

          }

          distribution.push(
            count
          );

        }

        message.innerHTML = `
          <div class="success">
            シフトを作成しました！<br>
            1日の勤務人数：
            ${distribution.join("・")}人
          </div>
        `;

        document.getElementById(
          "resultCard"
        ).scrollIntoView({
          behavior: "smooth"
        });

      }
      catch (error) {

        console.error(error);

        message.innerHTML = `
          <div class="error">
            シフト作成中にエラーが発生しました。<br>
            ページを再読み込みして、
            もう一度試してください。
          </div>
        `;

      }

    }, 50);

  }
);

   リセット
========================================================= */

document.getElementById(
  "resetBtn"
).addEventListener(
  "click",
  () => {

    requests = [];

    for (
      let s = 0;
      s < staff.length;
      s++

          .fill("");

    document.getElementById(
      "message"
    ).innerHTML = "";

    document.getElementById(
      "resultCard"
    ).classList.add(

    );

  }
);
