<script>

/* =========================================================
   データ
========================================================= */

let days = 0;

let staff = [];
let requests = [];
let previousState = [];

let schedule = [];

/* =========================================================
   DOM
========================================================= */

const yearSelect =
  document.getElementById("year");

const monthSelect =
  document.getElementById("month");

const staffCountSelect =
  document.getElementById("staffCount");

const maxConsecutiveSelect =
  document.getElementById("maxConsecutive");

/* =========================================================
   年・月
========================================================= */

const today = new Date();

for (
  let y = today.getFullYear() - 1;
  y <= today.getFullYear() + 3;
  y++
) {

  const option =
    document.createElement("option");

  option.value = y;
  option.textContent = y + "年";

  if (y === today.getFullYear()) {
    option.selected = true;
  }

  yearSelect.appendChild(option);

}

for (let m = 1; m <= 12; m++) {

  const option =
    document.createElement("option");

  option.value = m;
  option.textContent = m + "月";

  if (m === today.getMonth() + 1) {
    option.selected = true;
  }

  monthSelect.appendChild(option);

}

/* =========================================================
   月の日数
========================================================= */

function getDaysInSelectedMonth() {

  const year =
    Number(yearSelect.value);

  const month =
    Number(monthSelect.value);

  return new Date(
    year,
    month,
    0
  ).getDate();

}

/* =========================================================
   月変更
========================================================= */

function changeMonth() {

  const oldRequests =
    requests;

  days =
    getDaysInSelectedMonth();

  document.getElementById("daysLabel")
    .textContent = days;

  requests = [];

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    requests[s] = [];

    for (
      let d = 0;
      d < days;
      d++
    ) {

      requests[s][d] =
        oldRequests[s]?.[d] || "";

    }

  }

  staff.forEach(person => {

    person.publicHoliday =
      Math.min(
        Number(person.publicHoliday) || 0,
        days
      );

    person.paidLeave =
      Math.min(
        Number(person.paidLeave) || 0,
        days
      );

  });

  renderAll();

}

/* =========================================================
   スタッフ初期値
========================================================= */

function createStaff() {

  const count =
    Number(staffCountSelect.value);

  const oldStaff =
    staff;

  const oldPrevious =
    previousState;

  staff = [];
  previousState = [];

  for (
    let i = 0;
    i < count;
    i++
  ) {

    staff.push({

      name:
        oldStaff[i]?.name ||
        String.fromCharCode(65 + i),

      level:
        oldStaff[i]?.level || 2,

      publicHoliday:
        oldStaff[i]?.publicHoliday ?? 11,

      paidLeave:
        oldStaff[i]?.paidLeave ?? 0

    });

    previousState.push({

      shift:
        oldPrevious[i]?.shift || "休",

      consecutive:
        oldPrevious[i]?.consecutive ?? 0

    });

  }

}

/* =========================================================
   希望入力初期化
========================================================= */

function createRequests() {

  const old =
    requests;

  requests = [];

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    requests[s] = [];

    for (
      let d = 0;
      d < days;
      d++
    ) {

      requests[s][d] =
        old[s]?.[d] || "";

    }

  }

}

/* =========================================================
   全UI
========================================================= */

function renderAll() {

  renderPrevious();

  renderStaff();

  renderRequests();

}

/* =========================================================
   前月末
========================================================= */

function renderPrevious() {

  const container =
    document.getElementById(
      "previousContainer"
    );

  container.innerHTML = "";

  staff.forEach((person, i) => {

    const div =
      document.createElement("div");

    div.className =
      "staff-card";

    div.innerHTML = `

      <div class="staff-title">
        ${escapeHtml(person.name)}
      </div>

      <div class="row">

        <div class="field">

          <label>
            前月最終日
          </label>

          <select
            data-prev-staff="${i}"
            data-prev-field="shift"
          >

            <option value="HA"
              ${previousState[i].shift === "HA" ? "selected" : ""}>
              HA
            </option>

            <option value="HP"
              ${previousState[i].shift === "HP" ? "selected" : ""}>
              HP
            </option>

            <option value="休"
              ${previousState[i].shift === "休" ? "selected" : ""}>
              休
            </option>

            <option value="有休"
              ${previousState[i].shift === "有休" ? "selected" : ""}>
              有休
            </option>

          </select>

        </div>

        <div class="field">

          <label>
            前月末の連勤
          </label>

          <select
            data-prev-staff="${i}"
            data-prev-field="consecutive"
          >

            ${createConsecutiveOptions(
              previousState[i].consecutive
            )}

          </select>

        </div>

      </div>

    `;

    container.appendChild(div);

  });

}

function createConsecutiveOptions(selected) {

  const max =
    Number(maxConsecutiveSelect.value);

  let html = "";

  for (
    let i = 0;
    i <= max;
    i++
  ) {

    html += `
      <option
        value="${i}"
        ${Number(selected) === i ? "selected" : ""}
      >
        ${i === 0 ? "0（休み）" : i + "連勤目"}
      </option>
    `;

  }

  return html;

}

/* =========================================================
   スタッフ表示
========================================================= */

function renderStaff() {

  const container =
    document.getElementById(
      "staffContainer"
    );

  container.innerHTML = "";

  staff.forEach((person, i) => {

    const div =
      document.createElement("div");

    div.className =
      "staff-card";

    div.innerHTML = `

      <div class="staff-title">
        スタッフ${i + 1}
      </div>

      <div class="row">

        <div class="field">

          <label>名前</label>

          <input
            type="text"
            value="${escapeHtml(person.name)}"
            data-staff="${i}"
            data-field="name"
          >

        </div>

        <div class="field">

          <label>レベル</label>

          <select
            data-staff="${i}"
            data-field="level"
          >

            <option value="1"
              ${person.level === 1 ? "selected" : ""}>
              1：研修中
            </option>

            <option value="2"
              ${person.level === 2 ? "selected" : ""}>
              2：独り立ち
            </option>

          </select>

        </div>

        <div class="field">

          <label>公休</label>

          <input
            type="number"
            min="0"
            max="${days}"
            value="${person.publicHoliday}"
            data-staff="${i}"
            data-field="publicHoliday"
          >

        </div>

        <div class="field">

          <label>有休</label>

          <input
            type="number"
            min="0"
            max="${days}"
            value="${person.paidLeave}"
            data-staff="${i}"
            data-field="paidLeave"
          >

        </div>

      </div>

    `;

    container.appendChild(div);

  });

}

/* =========================================================
   希望表
========================================================= */

function renderRequests() {

  const head =
    document.getElementById(
      "requestHead"
    );

  const body =
    document.getElementById(
      "requestBody"
    );

  head.innerHTML = "";
  body.innerHTML = "";

  let header =
    "<tr><th>名前</th>";

  for (
    let d = 0;
    d < days;
    d++
  ) {

    header += `
      <th class="date-head">
        ${d + 1}日
      </th>
    `;

  }

  header += "</tr>";

  head.innerHTML =
    header;

  staff.forEach((person, s) => {

    let row =
      `<tr>
        <td>
          ${escapeHtml(person.name)}
        </td>`;

    for (
      let d = 0;
      d < days;
      d++
    ) {

      const value =
        requests[s][d];

      const cls =
        requestClass(value);

      row += `

        <td class="${cls}">

          <select
            class="request-select"
            data-s="${s}"
            data-d="${d}"
          >

            <option value=""
              ${value === "" ? "selected" : ""}>
              -
            </option>

            <option value="HA"
              ${value === "HA" ? "selected" : ""}>
              HA希望
            </option>

            <option value="HP"
              ${value === "HP" ? "selected" : ""}>
              HP希望
            </option>

            <option value="休"
              ${value === "休" ? "selected" : ""}>
              休
            </option>

            <option value="有休"
              ${value === "有休" ? "selected" : ""}>
              有休
            </option>

          </select>

        </td>

      `;

    }

    row += "</tr>";

    body.innerHTML += row;

  });

}

function requestClass(value) {

  if (value === "HA")
    return "request-ha";

  if (value === "HP")
    return "request-hp";

  if (value === "休")
    return "request-rest";

  if (value === "有休")
    return "request-paid";

  return "request-none";

}

/* =========================================================
   入力イベント
========================================================= */

document.addEventListener(
  "change",
  event => {

    const target =
      event.target;

    if (
      target.dataset.staff !== undefined
    ) {

      const i =
        Number(target.dataset.staff);

      const field =
        target.dataset.field;

      if (field === "name") {

        staff[i].name =
          target.value ||
          String.fromCharCode(65 + i);

        renderRequests();
        renderPrevious();

      }

      if (field === "level") {

        staff[i].level =
          Number(target.value);

      }

      if (
        field === "publicHoliday"
      ) {

        staff[i].publicHoliday =
          Math.max(
            0,
            Math.min(
              days,
              Number(target.value) || 0
            )
          );

        target.value =
          staff[i].publicHoliday;

      }

      if (
        field === "paidLeave"
      ) {

        staff[i].paidLeave =
          Math.max(
            0,
            Math.min(
              days,
              Number(target.value) || 0
            )
          );

        target.value =
          staff[i].paidLeave;

      }

    }

    if (
      target.dataset.prevStaff !== undefined
    ) {

      const i =
        Number(target.dataset.prevStaff);

      const field =
        target.dataset.prevField;

      if (field === "shift") {

        previousState[i].shift =
          target.value;

        if (
          target.value === "休" ||
          target.value === "有休"
        ) {

          previousState[i].consecutive = 0;

        }

      }

      if (
        field === "consecutive"
      ) {

        previousState[i].consecutive =
          Number(target.value);

      }

    }

    if (
      target.classList.contains(
        "request-select"
      )
    ) {

      const s =
        Number(target.dataset.s);

      const d =
        Number(target.dataset.d);

      requests[s][d] =
        target.value;

      target.closest("td").className =
        requestClass(
          target.value
        );

    }

  }
);

/* =========================================================
   最大連勤変更
========================================================= */

maxConsecutiveSelect.addEventListener(
  "change",
  () => {

    const max =
      Number(
        maxConsecutiveSelect.value
      );

    previousState.forEach(state => {

      if (
        state.consecutive > max
      ) {

        state.consecutive =
          max;

      }

    });

    renderPrevious();

  }
);

/* =========================================================
   月変更
========================================================= */

yearSelect.addEventListener(
  "change",
  changeMonth
);

monthSelect.addEventListener(
  "change",
  changeMonth
);

/* =========================================================
   人数変更
========================================================= */

staffCountSelect.addEventListener(
  "change",
  () => {

    createStaff();

    createRequests();

    renderAll();

  }
);

/* =========================================================
   ユーティリティ
========================================================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

function shuffle(array) {

  const result =
    [...array];

  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];

  }

  return result;

}

/* =========================================================
   希望チェック
========================================================= */

function validateRequests() {

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    let paid = 0;
    let rest = 0;

    for (
      let d = 0;
      d < days;
      d++
    ) {

      if (
        requests[s][d] === "有休"
      ) paid++;

      if (
        requests[s][d] === "休"
      ) rest++;

    }

    if (
      paid >
      Number(staff[s].paidLeave)
    ) {

      return `${staff[s].name}さんの有休希望が、設定した有休数を超えています。`;

    }

    if (
      rest >
      Number(staff[s].publicHoliday)
    ) {

      return `${staff[s].name}さんの休希望が、設定した公休数を超えています。`;

    }

  }

  return "";

}

/* =========================================================
   固定休
========================================================= */

function isFixedOff(s, d) {

  return (
    requests[s][d] === "休" ||
    requests[s][d] === "有休"
  );

}

/* =========================================================
   組み合わせ
========================================================= */

function combinations(
  array,
  count
) {

  if (count === 0)
    return [[]];

  if (array.length < count)
    return [];

  const result = [];

  function dfs(
    start,
    chosen
  ) {

    if (
      chosen.length === count
    ) {

      result.push(
        [...chosen]
      );

      return;

    }

    for (
      let i = start;
      i < array.length;
      i++
    ) {

      chosen.push(
        array[i]
      );

      dfs(
        i + 1,
        chosen
      );

      chosen.pop();

    }

  }

  dfs(0, []);

  return result;

}

/* =========================================================
   連勤可能性
========================================================= */

function canWork(
  currentRun,
  maxConsecutive
) {

  return (
    currentRun <
    maxConsecutive
  );

}

/* =========================================================
   日ごとの目標勤務人数
   ★今回の重要部分
========================================================= */

function createDailyWorkTargets(
  totalWork
) {

  const base =
    Math.floor(
      totalWork / days
    );

  const remainder =
    totalWork % days;

  const targets =
    new Array(days)
      .fill(base);

  /*
    余った勤務人数を
    月の中に均等に散らす。

    例：
    平均6.4人なら

    6,6,7,6,6,7,6,7...

    のように配置する。
  */

  for (
    let d = 0;
    d < days;
    d++
  ) {

    const before =
      Math.floor(
        d * remainder / days
      );

    const after =
      Math.floor(
        (d + 1) * remainder / days
      );

    if (
      after > before
    ) {

      targets[d]++;

    }

  }

  return targets;

}

/* =========================================================
   その日の勤務候補を作る
========================================================= */

function makeDailyCandidates(
  day,
  previousShifts,
  run,
  offCount,
  offTarget,
  targetWorkCount,
  maxConsecutive
) {

  const haNeed =
    Number(
      document.getElementById(
        "haNeed"
      ).value
    );

  const hpNeed =
    Number(
      document.getElementById(
        "hpNeed"
      ).value
    );

  const all =
    staff.map(
      (_, i) => i
    );

  const remainingDays =
    days - day;

  /*
    今日必ず休まなければならない人
  */

  const mustOff =
    new Set();

  /*
    今日必ず勤務しなければならない人
  */

  const mustWork =
    new Set();

  for (
    const s of all
  ) {

    /*
      希望休・有休
    */

    if (
      isFixedOff(s, day)
    ) {

      mustOff.add(s);
      continue;

    }

    /*
      最大連勤に到達している
    */

    if (
      run[s] >= maxConsecutive
    ) {

      mustOff.add(s);
      continue;

    }

    /*
      すでに休みを使い切った
    */

    if (
      offCount[s] >= offTarget[s]
    ) {

      mustWork.add(s);
      continue;

    }

    /*
      残り日数すべて休んでも
      必要な休みを消化できない場合
      → 今日勤務必須
    */

    const remainingOff =
      offTarget[s] -
      offCount[s];

    if (
      remainingOff ===
      remainingDays
    ) {

      mustOff.add(s);

    }

  }

  /*
    勤務と休みが矛盾している
  */

  for (
    const s of mustWork
  ) {

    if (
      mustOff.has(s)
    ) {

      return [];

    }

  }

  /*
    HP→翌日HA禁止のため、
    前日HPの人はHA不可。
    ただしHP勤務は可能。
  */

  const available =
    all.filter(
      s =>
        !mustOff.has(s)
    );

  if (
    available.length <
    haNeed + hpNeed
  ) {

    return [];

  }

  /*
    目標人数の前後を少し許容。
    希望休などで完全均等が難しい場合に対応。
  */

  const minCount =
    Math.max(
      haNeed + hpNeed,
      mustWork.size
    );

  const maxCount =
    available.length;

  const sizeCandidates = [];

  /*
    まず目標人数を優先
  */

  const offsets = [
    0,
    -1,
    1,
    -2,
    2
  ];

  for (
    const offset of offsets
  ) {

    const count =
      targetWorkCount + offset;

    if (
      count >= minCount &&
      count <= maxCount &&
      !sizeCandidates.includes(count)
    ) {

      sizeCandidates.push(count);

    }

  }

  /*
    目標人数そのものが無理なら
    最低人数を候補にする
  */

  if (
    sizeCandidates.length === 0 &&
    minCount <= maxCount
  ) {

    sizeCandidates.push(
      minCount
    );

  }

  const candidates = [];

  for (
    const workCount of sizeCandidates
  ) {

    const flexible =
      available.filter(
        s => !mustWork.has(s)
      );

    const needFlexible =
      workCount -
      mustWork.size;

    if (
      needFlexible < 0 ||
      needFlexible > flexible.length
    ) {

      continue;

    }

    const workSets =
      combinations(
        flexible,
        needFlexible
      );

    for (
      const extraWork of workSets
    ) {

      const working =
        [
          ...mustWork,
          ...extraWork
        ];

      /*
        勤務者が全員level1ならNG
      */

      const hasLevel2 =
        working.some(
          s => staff[s].level === 2
        );

      const hasLevel1 =
        working.some(
          s => staff[s].level === 1
        );

      if (
        hasLevel1 &&
        !hasLevel2
      ) {

        continue;

      }

      /*
        今日休ませる人数
      */

      const workingSet =
        new Set(working);

      let valid = true;

      for (
        const s of all
      ) {

        if (
          workingSet.has(s)
        ) {

          continue;

        }

        const newOff =
          offCount[s] + 1;

        if (
          newOff >
          offTarget[s]
        ) {

          valid = false;
          break;

        }

        const futureDays =
          days - day - 1;

        const futureOff =
          offTarget[s] - newOff;

        if (
          futureOff < 0 ||
          futureOff > futureDays
        ) {

          valid = false;
          break;

        }

      }

      if (!valid)
        continue;

      /*
        シフトを決定
      */

      const shiftCandidates =
        makeShiftCandidates(
          working,
          day,
          previousShifts,
          haNeed,
          hpNeed
        );

      for (
        const shift of shiftCandidates
      ) {

        let score =
          shift.score;

        /*
          目標人数から離れるほど減点
        */

        score -=
          Math.abs(
            workCount -
            targetWorkCount
          ) * 150;

        /*
          今日勤務してほしい人を
          勤務させることに少し加点
        */

        for (
          const s of working
        ) {

          if (
            offCount[s] < offTarget[s]
          ) {

            const remainingOff =
              offTarget[s] -
              offCount[s];

            const remainingDaysAfter =
              days - day - 1;

            /*
              休みをまだ多く残している人は
              無理に勤務させない
            */

            if (
              remainingOff <
              remainingDaysAfter
            ) {

              score += 2;

            }

          }

        }

        candidates.push({

          ha: shift.ha,

          hp: shift.hp,

          score

        });

      }

    }

  }

  /*
    スコア順に並べる
  */

  candidates.sort(
    (a, b) =>
      b.score - a.score
  );

  /*
    候補が多すぎると
    iPhoneで重くなるので上限を設定
  */

  return candidates.slice(
    0,
    120
  );

}

/* =========================================================
   HA / HP の割り振り
========================================================= */

function makeShiftCandidates(
  working,
  day,
  previousShifts,
  haNeed,
  hpNeed
) {

  const result = [];

  const maxHA =
    working.length -
    hpNeed;

  if (
    maxHA < haNeed
  ) {

    return [];

  }

  /*
    HA人数を
    最低人数～最大人数まで試す。
    これにより追加勤務を
    HAにもHPにも振れる。
  */

  for (
    let haCount = haNeed;
    haCount <= maxHA;
    haCount++
  ) {

    const eligibleHA =
      working.filter(
        s =>
          previousShifts[s] !== "HP"
      );

    if (
      eligibleHA.length <
      haCount
    ) {

      continue;

    }

    /*
      HA適性スコア
    */

    const rankedHA =
      [...eligibleHA]
        .sort(
          (a, b) =>
            shiftPreferenceScore(
              b,
              "HA",
              day
            ) -
            shiftPreferenceScore(
              a,
              "HA",
              day
            )
        );

    /*
      上位候補を少し入れ替える
      ランダム性を持たせる
    */

    const ha =
      chooseBestCombination(
        rankedHA,
        haCount,
        day
      );

    for (
      const selectedHA of ha
    ) {

      const haSet =
        new Set(selectedHA);

      const hp =
        working.filter(
          s => !haSet.has(s)
        );

      if (
        hp.length < hpNeed
      ) {

        continue;

      }

      let score = 0;

      /*
        HA評価
      */

      for (
        const s of selectedHA
      ) {

        score +=
          shiftPreferenceScore(
            s,
            "HA",
            day
          );

      }

      /*
        HP評価
      */

      for (
        const s of hp
      ) {

        score +=
          shiftPreferenceScore(
            s,
            "HP",
            day
          );

      }

      /*
        HA人数を増やしすぎないよう
        少しだけ減点。
        ただし追加HAは禁止しない。
      */

      score -=
        (haCount - haNeed) * 3;

      result.push({

        ha:
          selectedHA,

        hp,

        score

      });

    }

  }

  return result.sort(
    (a, b) =>
      b.score - a.score
  ).slice(
    0,
    30
  );

}

/* =========================================================
   希望・前日継続の評価
========================================================= */

function shiftPreferenceScore(
  s,
  shift,
  day
) {

  let score = 0;

  const request =
    requests[s][day];

  /*
    希望一致
  */

  if (
    request === shift
  ) {

    score += 100;

  }

  /*
    希望と違う勤務は少し減点
  */

  if (
    request === "HA" &&
    shift !== "HA"
  ) {

    score -= 40;

  }

  if (
    request === "HP" &&
    shift !== "HP"
  ) {

    score -= 40;

  }

  /*
    前日と同じ勤務を少し優先
  */

  if (
    previousState[s].shift === shift ||
    (day > 0 && false)
  ) {

    score += 15;

  }

  /*
    前日HP→当日HAは禁止なので
    ここではHA評価を下げるだけではなく
    実際の候補から除外している。
  */

  return score;

}

/* =========================================================
   HA候補の組み合わせ
========================================================= */

function chooseBestCombination(
  array,
  count,
  day
) {

  if (
    count === 0
  ) {

    return [[]];

  }

  if (
    array.length < count
  ) {

    return [];

  }

  /*
    全組み合わせを作る。
    最大10人なので十分軽い。
  */

  const all =
    combinations(
      array,
      count
    );

  /*
    希望を考慮して並べる。
  */

  all.sort(
    (a, b) => {

      const scoreA =
        a.reduce(
          (sum, s) =>
            sum +
            shiftPreferenceScore(
              s,
              "HA",
              day
            ),
          0
        );

      const scoreB =
        b.reduce(
          (sum, s) =>
            sum +
            shiftPreferenceScore(
              s,
              "HA",
              day
            ),
          0
        );

      return scoreB - scoreA;

    }
  );

  /*
    上位候補＋少しランダム
  */

  const top =
    all.slice(
      0,
      Math.min(8, all.length)
    );

  return shuffle(top);

}

/* =========================================================
   シフト作成
========================================================= */

function generateSchedule() {

  const haNeed =
    Number(
      document.getElementById(
        "haNeed"
      ).value
    );

  const hpNeed =
    Number(
      document.getElementById(
        "hpNeed"
      ).value
    );

  const minimum =
    haNeed + hpNeed;

  if (
    staff.length < minimum
  ) {

    return {
      error:
        `スタッフが${staff.length}人しかいません。` +
        `HA${haNeed}人＋HP${hpNeed}人なので、` +
        `最低${minimum}人必要です。`
    };

  }

  const maxConsecutive =
    Number(
      maxConsecutiveSelect.value
    );

  /*
    各人の必要休日数
  */

  const offTarget =
    staff.map(
      p =>
        Number(p.publicHoliday) +
        Number(p.paidLeave)
    );

  /*
    総勤務日数
  */

  const totalWork =
    staff.length * days -
    offTarget.reduce(
      (a, b) => a + b,
      0
    );

  /*
    最低人数を月平均で
    満たせないなら不可能
  */

  if (
    totalWork <
    minimum * days
  ) {

    return {
      error:
        `公休・有休を考慮すると、` +
        `月全体の勤務日数が不足しています。` +
        `<br>必要な最低勤務人数は1日${minimum}人です。`
    };

  }

  /*
    1日の平均勤務人数
  */

  const dailyTargets =
    createDailyWorkTargets(
      totalWork
    );

  /*
    希望休数チェック
  */

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    let fixedOff = 0;
    let fixedPaid = 0;

    for (
      let d = 0;
      d < days;
      d++
    ) {

      if (
        requests[s][d] === "休"
      ) {

        fixedOff++;

      }

      if (
        requests[s][d] === "有休"
      ) {

        fixedOff++;
        fixedPaid++;

      }

    }

    if (
      fixedPaid >
      Number(staff[s].paidLeave)
    ) {

      return {
        error:
          `${staff[s].name}さんの有休希望が設定数を超えています。`
      };

    }

    if (
      fixedOff >
      offTarget[s]
    ) {

      return {
        error:
          `${staff[s].name}さんの休み希望が多すぎます。`
      };

    }

  }

  let best = null;
  let bestScore = -Infinity;

  /*
    ランダム探索
  */

  const attempts = 300;

  for (
    let attempt = 0;
    attempt < attempts;
    attempt++
  ) {

    const result =
      Array.from(
        {length: staff.length},
        () =>
          new Array(days)
            .fill(null)
      );

    const offCount =
      new Array(
        staff.length
      ).fill(0);

    const run =
      previousState.map(
        state =>
          Number(state.consecutive) || 0
      );

    const previousShift =
      previousState.map(
        state =>
          state.shift || "休"
      );

    /*
      固定休を設定
    */

    for (
      let s = 0;
      s < staff.length;
      s++
    ) {

      for (
        let d = 0;
        d < days;
        d++
      ) {

        if (
          requests[s][d] === "有休"
        ) {

          result[s][d] =
            "有休";

          offCount[s]++;

        }

        else if (
          requests[s][d] === "休"
        ) {

          result[s][d] =
            "休";

          offCount[s]++;

        }

      }

    }

    let failed = false;

    /*
      日ごとに作成
    */

    for (
      let d = 0;
      d < days;
      d++
    ) {

      const candidates =
        makeDailyCandidates(
          d,
          previousShift,
          run,
          offCount,
          offTarget,
          dailyTargets[d],
          maxConsecutive
        );

      if (
        candidates.length === 0
      ) {

        failed = true;
        break;

      }

      /*
        上位候補からランダム選択
      */

      const pool =
        candidates.slice(
          0,
          Math.min(
            35,
            candidates.length
          )
        );

      const chosen =
        pool[
          Math.floor(
            Math.random() *
            pool.length
          )
        ];

      const working =
        new Set([
          ...chosen.ha,
          ...chosen.hp
        ]);

      for (
        let s = 0;
        s < staff.length;
        s++
      ) {

        if (
          working.has(s)
        ) {

          if (
            chosen.ha.includes(s)
          ) {

            result[s][d] =
              "HA";

          } else {

            result[s][d] =
              "HP";

          }

          run[s]++;

          previousShift[s] =
            result[s][d];

        }

        else {

          if (
            result[s][d] !== "有休" &&
            result[s][d] !== "休"
          ) {

            result[s][d] =
              "休";

          }

          offCount[s]++;

          run[s] = 0;

          previousShift[s] =
            result[s][d];

        }

      }

    }

    if (failed)
      continue;

    /*
      最終的な休日日数確認
    */

    for (
      let s = 0;
      s < staff.length;
      s++
    ) {

      if (
        offCount[s] !==
        offTarget[s]
      ) {

        failed = true;
        break;

      }

    }

    if (failed)
      continue;

    /*
      スケジュール評価
    */

    let score = 0;

    for (
      let s = 0;
      s < staff.length;
      s++
    ) {

      for (
        let d = 0;
        d < days;
        d++
      ) {

        const current =
          result[s][d];

        /*
          希望一致
        */

        if (
          requests[s][d] ===
          current
        ) {

          score += 100;

        }

        /*
          HA連続
        */

        if (
          current === "HA" &&
          d > 0 &&
          result[s][d - 1] === "HA"
        ) {

          score += 12;

        }

        /*
          HP連続
        */

        if (
          current === "HP" &&
          d > 0 &&
          result[s][d - 1] === "HP"
        ) {

          score += 12;

        }

      }

    }

    /*
      日ごとの人数のばらつきを評価
    */

    for (
      let d = 0;
      d < days;
      d++
    ) {

      let workCount = 0;

      for (
        let s = 0;
        s < staff.length;
        s++
      ) {

        if (
          result[s][d] === "HA" ||
          result[s][d] === "HP"
        ) {

          workCount++;

        }

      }

      /*
        目標人数との差を強く減点
      */

      score -=
        Math.abs(
          workCount -
          dailyTargets[d]
        ) * 300;

    }

    /*
      単発勤務を減点
    */

    for (
      let s = 0;
      s < staff.length;
      s++
    ) {

      for (
        let d = 0;
        d < days;
        d++
      ) {

        const working =
          result[s][d] === "HA" ||
          result[s][d] === "HP";

        if (!working)
          continue;

        const before =
          d === 0
            ? previousState[s].consecutive > 0
            : (
                result[s][d - 1] === "HA" ||
                result[s][d - 1] === "HP"
              );

        const after =
          d === days - 1
            ? false
            : (
                result[s][d + 1] === "HA" ||
                result[s][d + 1] === "HP"
              );

        if (
          !before &&
          !after
        ) {

          score -= 100;

        }

      }

    }

    /*
      月初の連勤継続を少し評価
    */

    for (
      let s = 0;
      s < staff.length;
      s++
    ) {

      if (
        previousState[s].consecutive > 0 &&
        (
          result[s][0] === "HA" ||
          result[s][0] === "HP"
        )
      ) {

        score += 15;

      }

    }

    if (
      score > bestScore
    ) {

      bestScore = score;
      best = result;

    }

  }

  if (!best) {

    return {
      error:
        "設定された条件をすべて満たすシフトを作成できませんでした。"
    };

  }

  return {
    schedule: best
  };

}

/* =========================================================
   最終検証
========================================================= */

function validateSchedule(result) {

  const haNeed =
    Number(
      document.getElementById(
        "haNeed"
      ).value
    );

  const hpNeed =
    Number(
      document.getElementById(
        "hpNeed"
      ).value
    );

  const max =
    Number(
      maxConsecutiveSelect.value
    );

  /*
    日別人数
    ★「ちょうど」ではなく「最低」
  */

  for (
    let d = 0;
    d < days;
    d++
  ) {

    let ha = 0;
    let hp = 0;

    const working = [];

    for (
      let s = 0;
      s < staff.length;
      s++
    ) {

      if (
        result[s][d] === "HA"
      ) {

        ha++;
        working.push(s);

      }

      if (
        result[s][d] === "HP"
      ) {

        hp++;
        working.push(s);

      }

    }

    /*
      最低人数チェック
    */

    if (
      ha < haNeed
    ) {

      return `${d + 1}日のHA人数が最低${haNeed}人を満たしていません。`;

    }

    if (
      hp < hpNeed
    ) {

      return `${d + 1}日のHP人数が最低${hpNeed}人を満たしていません。`;

    }

    /*
      レベル1
    */

    const hasLevel1 =
      working.some(
        s => staff[s].level === 1
      );

    const hasLevel2 =
      working.some(
        s => staff[s].level === 2
      );

    if (
      hasLevel1 &&
      !hasLevel2
    ) {

      return `${d + 1}日にレベル2スタッフが必要です。`;

    }

  }

  /*
    連勤
  */

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    let run =
      Number(
        previousState[s].consecutive
      ) || 0;

    for (
      let d = 0;
      d < days;
      d++
    ) {

      const working =
        result[s][d] === "HA" ||
        result[s][d] === "HP";

      if (working) {

        run++;

        if (
          run > max
        ) {

          return `${staff[s].name}さんが${max}連勤を超えています。`;

        }

      } else {

        run = 0;

      }

    }

  }

  /*
    HP→翌日HA
  */

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    if (
      previousState[s].shift === "HP" &&
      result[s][0] === "HA"
    ) {

      return `${staff[s].name}さんが前月末HP→今月1日HAになっています。`;

    }

    for (
      let d = 0;
      d < days - 1;
      d++
    ) {

      if (
        result[s][d] === "HP" &&
        result[s][d + 1] === "HA"
      ) {

        return `${staff[s].name}さんがHPの翌日にHAになっています。`;

      }

    }

  }

  /*
    希望休
  */

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    for (
      let d = 0;
      d < days;
      d++
    ) {

      if (
        requests[s][d] === "休" &&
        result[s][d] !== "休"
      ) {

        return `${staff[s].name}さんの${d + 1}日休希望が反映されていません。`;

      }

      if (
        requests[s][d] === "有休" &&
        result[s][d] !== "有休"
      ) {

        return `${staff[s].name}さんの${d + 1}日有休希望が反映されていません。`;

      }

    }

  }

  /*
    公休・有休数
  */

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    let off = 0;

    for (
      let d = 0;
      d < days;
      d++
    ) {

      if (
        result[s][d] === "休" ||
        result[s][d] === "有休"
      ) {

        off++;

      }

    }

    const target =
      Number(staff[s].publicHoliday) +
      Number(staff[s].paidLeave);

    if (
      off !== target
    ) {

      return `${staff[s].name}さんの休日日数が設定値と一致していません。`;

    }

  }

  return "";

}

/* =========================================================
   結果表示
========================================================= */

function renderResult() {

  const card =
    document.getElementById(
      "resultCard"
    );

  const head =
    document.getElementById(
      "resultHead"
    );

  const body =
    document.getElementById(
      "resultBody"
    );

  card.classList.remove(
    "hidden"
  );

  let header =
    "<tr><th>名前</th>";

  for (
    let d = 0;
    d < days;
    d++
  ) {

    header += `
      <th>
        ${d + 1}日
      </th>
    `;

  }

  header += "</tr>";

  head.innerHTML =
    header;

  body.innerHTML = "";

  for (
    let s = 0;
    s < staff.length;
    s++
  ) {

    let row =
      `<tr>
        <td>
          ${escapeHtml(
            staff[s].name
          )}
        </td>`;

    for (
      let d = 0;
      d < days;
      d++
    ) {

      const value =
        schedule[s][d];

      let cls =
        "shift-rest";

      if (
        value === "HA"
      ) {

        cls =
          "shift-ha";

      }

      if (
        value === "HP"
      ) {

        cls =
          "shift-hp";

      }

      if (
        value === "有休"
      ) {

        cls =
          "shift-paid";

      }

      let mark = "";

      if (
        requests[s][d] === "HA"
      ) {

        mark =
          `<span class="request-mark">
            HA希望
          </span>`;

      }

      if (
        requests[s][d] === "HP"
      ) {

        mark =
          `<span class="request-mark">
            HP希望
          </span>`;

      }

      if (
        requests[s][d] === "休"
      ) {

        mark =
          `<span class="request-mark">
            休希望
          </span>`;

      }

      if (
        requests[s][d] === "有休"
      ) {

        mark =
          `<span class="request-mark">
            有休
          </span>`;

      }

      row += `
        <td class="${cls}">
          ${value}
          ${mark}
        </td>
      `;

    }

    row += "</tr>";

    body.innerHTML += row;

  }

}

/* =========================================================
   作成ボタン
========================================================= */

document.getElementById(
  "generateBtn"
).addEventListener(
  "click",
  () => {

    const message =
      document.getElementById(
        "message"
      );

    message.innerHTML = `
      <div class="success">
        シフトを作成しています……<br>
        人数のばらつきもできるだけ均等にしています。
      </div>
    `;

    setTimeout(() => {

      try {

        const requestError =
          validateRequests();

        if (
          requestError
        ) {

          message.innerHTML = `
            <div class="error">
              ${escapeHtml(
                requestError
              )}
            </div>
          `;

          return;

        }

        const result =
          generateSchedule();

        if (
          result.error
        ) {

          message.innerHTML = `
            <div class="error">
              ${escapeHtml(
                result.error
              )}
              <br><br>
              公休数・有休数・希望休・最大連勤・
              前月末の状態などの組み合わせによって、
              条件を満たせない場合があります。
            </div>
          `;

          return;

        }

        schedule =
          result.schedule;

        const finalError =
          validateSchedule(
            schedule
          );

        if (
          finalError
        ) {

          message.innerHTML = `
            <div class="error">
              ${escapeHtml(
                finalError
              )}
            </div>
          `;

          return;

        }

        renderResult();

        /*
          実際の人数分布も確認して表示
        */

        const distribution = [];

        for (
          let d = 0;
          d < days;
          d++
        ) {

          let count = 0;

          for (
            let s = 0;
            s < staff.length;
            s++
          ) {

            if (
              schedule[s][d] === "HA" ||
              schedule[s][d] === "HP"
            ) {

              count++;

            }

          }

          distribution.push(count);

        }

        message.innerHTML = `
          <div class="success">
            シフトを作成しました！<br>
            1日の勤務人数：
            ${distribution.join("・")}人
          </div>
        `;

        document.getElementById(
          "resultCard"
        ).scrollIntoView({
          behavior: "smooth"
        });

      } catch (error) {

        console.error(error);

        message.innerHTML = `
          <div class="error">
            シフト作成中にエラーが発生しました。<br>
            ページを再読み込みして、
            もう一度試してください。
          </div>
        `;

      }

    }, 50);

  }
);

   リセット

document.getElementById(
  "resetBtn"
).addEventListener(

    requests = [];

    for (

    );
